<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ลอยกระทงด้วยกัน • 16-Bit Pixel Riverside</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #061018;
      color: #f8fafc;
      user-select: none;
    }
    #game-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0c1f2e 0%, #040b11 100%);
    }
    canvas#world {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: pointer;
    }

    /* HUD Top */
    .hud-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px;
      pointer-events: none;
      z-index: 15;
    }
    .pill {
      pointer-events: auto;
      background: rgba(11, 19, 30, 0.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 7px 11px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .net-badge {
      font-size: 11px;
      color: #94a3b8;
      background: rgba(255,255,255,0.07);
      padding: 2px 7px;
      border-radius: 8px;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-primary { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-warm { background: linear-gradient(135deg, #f59e0b, #ea580c); }
    .btn-purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .btn-ghost { background: rgba(255, 255, 255, 0.13); }
    .btn-ghost.active {
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      box-shadow: 0 0 14px rgba(236, 72, 153, 0.6);
    }

    /* Toast */
    #toast {
      position: absolute;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 19, 30, 0.96);
      border: 1px solid #fbbf24;
      color: #fef3c7;
      padding: 9px 18px;
      border-radius: 14px;
      font-size: 13px;
      z-index: 25;
      display: none;
      text-align: center;
      max-width: 90vw;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6);
    }

    /* HUD Bottom */
    .hud-bottom {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
      pointer-events: none;
      z-index: 15;
    }
    .chat-panel {
      pointer-events: auto;
      width: 330px;
      max-width: 62vw;
      background: rgba(11, 19, 30, 0.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .chat-messages {
      max-height: 92px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.45;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 0 4px;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    .chat-form {
      display: flex;
      gap: 6px;
    }
    .chat-form input {
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 9px;
      padding: 6px 10px;
      color: #fff;
      font-size: 13px;
      outline: none;
      user-select: text;
    }
    .chat-form input:focus { border-color: #34d399; }

    .right-controls {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .emote-bar {
      display: flex;
      gap: 4px;
      background: rgba(11, 19, 30, 0.86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 13px;
      padding: 5px 9px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .emote-btn {
      background: transparent;
      border: none;
      font-size: 20px;
      padding: 2px 5px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .emote-btn:hover { transform: scale(1.25); }

    /* Modals */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 11, 18, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 14px;
    }
    .card {
      background: #121e2d;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 20px;
      width: 460px;
      max-width: 100%;
      max-height: 94vh;
      overflow-y: auto;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
    }
    .card::-webkit-scrollbar { width: 5px; }
    .card::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    .card h2 {
      font-size: 20px;
      color: #fbbf24;
      margin-bottom: 4px;
    }
    .card p.sub {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .form-group { margin-bottom: 11px; }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 5px;
      font-weight: 500;
    }
    .form-group input[type="text"], .form-group select {
      width: 100%;
      background: #0b131d;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
      user-select: text;
    }
    .form-group input[type="text"]:focus, .form-group select:focus { border-color: #10b981; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 420px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    /* Gender Toggle */
    .gender-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .gender-btn {
      background: #0b131d;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      padding: 8px;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .gender-btn.active[data-gender="female"] {
      background: rgba(236, 72, 153, 0.22);
      border-color: #ec4899;
      color: #fbcfe8;
    }
    .gender-btn.active[data-gender="male"] {
      background: rgba(59, 130, 246, 0.22);
      border-color: #3b82f6;
      color: #bfdbfe;
    }

    /* Swatches + Color Picker */
    .swatches {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: center;
    }
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.2);
      transition: transform 0.12s, border-color 0.12s;
      flex-shrink: 0;
    }
    .swatch.active {
      border-color: #fff;
      transform: scale(1.16);
      box-shadow: 0 0 10px rgba(255,255,255,0.55);
    }
    .color-picker-wrap {
      position: relative;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px dashed rgba(255,255,255,0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
    }
    .color-picker-wrap input[type="color"] {
      position: absolute;
      inset: -6px;
      width: 40px;
      height: 40px;
      opacity: 0;
      cursor: pointer;
    }

    /* Avatar Preview Box */
    .preview-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #234736 0%, #0b131d 100%);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .preview-controls {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .mini-btn {
      background: rgba(255,255,255,0.12);
      border: none;
      color: #e2e8f0;
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 11px;
      cursor: pointer;
    }
    .mini-btn:hover { background: rgba(255,255,255,0.22); }
  </style>
</head>
<body>

<div id="game-wrap">
  <!-- Native 16-bit Pixel Art Resolution: 480x270 (16:9 integer-scaled cleanly) -->
  <canvas id="world" width="480" height="270"></canvas>

  <!-- Top HUD -->
  <div class="hud-top">
    <div class="pill">
      <span id="status-dot" title="สถานะการเชื่อมต่อ">🟡</span>
      <span>ห้อง: <strong id="hud-room">-</strong></span>
      <span>👥 <strong id="hud-players">1</strong></span>
      <span class="net-badge" id="hud-net" title="Authoritative Tick & RTT">20Hz • 0ms</span>
      <button class="btn btn-ghost" id="btn-invite">🔗 ชวนแฟน</button>
    </div>

    <div class="pill">
      <button class="btn btn-purple" id="btn-wardrobe">👗 แต่งตัว</button>
      <button class="btn btn-ghost" id="btn-hold-hands" title="เดินตามและจับมือกับแฟนอัตโนมัติ">🤝 จับมือแฟน</button>
      <button class="btn btn-warm" id="btn-lantern">🏮 โคมลอย</button>
      <button class="btn btn-primary" id="btn-krathong">🪷 ลอยกระทง</button>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Bottom HUD -->
  <div class="hud-bottom">
    <div class="chat-panel">
      <div class="chat-messages" id="chat-messages">
        <div style="color:#fbbf24;">✨ แตะบนพื้นหรือกด WASD / ลูกศร เพื่อเดินเล่นริมแม่น้ำ</div>
      </div>
      <form class="chat-form" id="chat-form">
        <input type="text" id="chat-input" placeholder="พิมพ์ข้อความขึ้นบนหัว..." maxlength="80" autocomplete="off" />
        <button type="submit" class="btn btn-primary">ส่ง</button>
      </form>
    </div>

    <div class="right-controls">
      <div class="emote-bar">
        <button class="emote-btn" data-emote="❤️">❤️</button>
        <button class="emote-btn" data-emote="🥰">🥰</button>
        <button class="emote-btn" data-emote="🙏">🙏</button>
        <button class="emote-btn" data-emote="✨">✨</button>
        <button class="emote-btn" data-emote="🌸">🌸</button>
      </div>
    </div>
  </div>
</div>

<!-- Join / Wardrobe Customization Modal -->
<div class="overlay" id="modal-join">
  <div class="card">
    <h2 id="modal-title">🏮 แต่งตัว & เข้าสู่ริมแม่น้ำ</h2>
    <p class="sub" id="modal-sub">เลือกเพศ ทรงผม สีผม และชุดไทยสไตล์พิกเซลน่ารัก</p>

    <div class="preview-box">
      <canvas id="avatar-preview" width="96" height="96" style="width:96px;height:96px;image-rendering:pixelated;"></canvas>
      <div class="preview-controls">
        <button type="button" class="mini-btn" id="btn-rot-left">↺ หมุนซ้าย</button>
        <button type="button" class="mini-btn" id="btn-rot-right">หมุนขวา ↻</button>
      </div>
    </div>

    <div class="grid-2" id="room-name-row">
      <div class="form-group">
        <label>ชื่อบนหัวตัวละคร</label>
        <input type="text" id="inp-name" placeholder="เช่น น้องบีม, พี่ภัทร..." maxlength="16" />
      </div>
      <div class="form-group">
        <label>รหัสห้อง (ใช้รหัสเดียวกับแฟน)</label>
        <input type="text" id="inp-room" placeholder="เช่น LOVE2026" maxlength="12" />
      </div>
    </div>

    <div class="form-group">
      <label>เลือกเพศตัวละคร</label>
      <div class="gender-row">
        <div class="gender-btn active" data-gender="female">👩 ผู้หญิง</div>
        <div class="gender-btn" data-gender="male">👨 ผู้ชาย</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>เลือกทรงผม & เครื่องหัว</label>
        <select id="inp-hair-style">
          <option value="0">ผมสั้นซอยเท่</option>
          <option value="1" selected>ผมยาวตรงสลวย</option>
          <option value="2">ผมประบ่าปลายงุ้ม</option>
          <option value="3">ผมเกล้ามวยไทย + ปิ่นทอง</option>
          <option value="4">ผมแกละสองข้างน่ารัก</option>
          <option value="5">ผมเปียคู่ผูกโบว์</option>
          <option value="6">ผมแสกกลางสไตล์เกาหลี</option>
          <option value="7">มงกุฎดอกไม้</option>
          <option value="8">หมวกหมาป่าชนเผ่า</option>
        </select>
      </div>

      <div class="form-group">
        <label>เลือกชุดไทย & เครื่องแต่งกาย</label>
        <select id="inp-outfit-style">
          <option value="chakkri" selected>ชุดไทยจักรี (สไบเฉียง + ผ้าถุงหน้านาง)</option>
          <option value="siwalai">ชุดไทยศิวาลัย (แขนยาวขลิบทอง)</option>
          <option value="raj_pattern">ชุดไทยราชปะแตน + โจงกระเบน</option>
          <option value="lanna">ชุดไทยล้านนา (เสื้อปั๊ด + ผ้าซิ่นตีนจก)</option>
          <option value="boran">ชุดไทยโบราณ (ผ้าแถบ / ผ้าขาวม้า)</option>
          <option value="tribal">ชุดชนเผ่าพื้นเมือง</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>สีผิว</label>
      <div class="swatches" id="sw-skin"></div>
    </div>

    <div class="form-group">
      <label>สีผม (เลือกสีสำเร็จหรือแตะวงล้อสี)</label>
      <div class="swatches" id="sw-hair"></div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>สีสไบ / เสื้อท่อนบน</label>
        <div class="swatches" id="sw-outfit"></div>
      </div>
      <div class="form-group">
        <label>สีผ้าถุง / โจงกระเบน</label>
        <div class="swatches" id="sw-bottom"></div>
      </div>
    </div>

    <div style="display:flex; gap:8px; margin-top:6px;">
      <button type="button" class="btn btn-ghost" id="btn-close-wardrobe" style="display:none; flex:1; justify-content:center;">ปิด</button>
      <button type="button" class="btn btn-primary" id="btn-start" style="flex:2; justify-content:center; padding:11px; font-size:15px;">
        เข้าสู่ริมแม่น้ำ ✨
      </button>
    </div>
  </div>
</div>

<!-- Krathong Modal -->
<div class="overlay" id="modal-krathong" style="display:none;">
  <div class="card" style="width:400px;">
    <h2>🪷 ประดิษฐ์กระทงอธิษฐาน</h2>
    <p class="sub">ตัวละครจะเดินลงไปริมตลิ่งและปล่อยกระทงพร้อมกันทั้ง 2 จอ</p>

    <div class="form-group">
      <label>รูปแบบกระทง</label>
      <select id="k-style">
        <option value="lotus">กระทงใบตอง-ดอกบัวเรืองแสง</option>
        <option value="raft">กระทงแพไม้ไผ่</option>
        <option value="leaf">กระทงใบบัวธรรมชาติ</option>
        <option value="heart">กระทงคู่รูปหัวใจ 💕</option>
      </select>
    </div>

    <div class="form-group">
      <label>สีแสงเทียน</label>
      <select id="k-candle">
        <option value="#fde047">เหลืองทองอบอุ่น</option>
        <option value="#f472b6">ชมพูโรแมนติก</option>
        <option value="#34d399">เขียวมรกต</option>
        <option value="#60a5fa">ฟ้าคราม</option>
      </select>
    </div>

    <div class="form-group">
      <label>คำอธิษฐาน (คลิกที่กระทงในน้ำเพื่ออ่านได้)</label>
      <input type="text" id="k-wish" placeholder="ขอให้เรารักกันนานๆ มีความสุขด้วยกันตลอดไป..." maxlength="100" />
    </div>

    <div style="display:flex; gap:8px; margin-top:14px;">
      <button type="button" class="btn btn-ghost" id="btn-k-cancel" style="flex:1; justify-content:center;">ยกเลิก</button>
      <button type="button" class="btn btn-primary" id="btn-k-launch" style="flex:2; justify-content:center;">🙏 อธิษฐานและลอยกระทง</button>
    </div>
  </div>
</div>

<script>
  // Logical 16-bit SNES/GBA canvas resolution (480x270)
  const W = 480;
  const H = 270;
  const canvas = document.getElementById('world');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const prevCanvas = document.getElementById('avatar-preview');
  const prevCtx = prevCanvas.getContext('2d');
  prevCtx.imageSmoothingEnabled = false;

  // Read room from URL ?room=XXXX
  const params = new URLSearchParams(window.location.search);
  const initialRoom = (params.get('room') || ('LOVE' + Math.floor(100 + Math.random() * 900))).toUpperCase();
  document.getElementById('inp-room').value = initialRoom;

  // Customization State & Palettes
  const skinColors = ['#ffe5d0', '#ffdbac', '#f1c27d', '#e0ac69', '#c68642', '#8d5524'];
  const hairColors = ['#2b1910', '#54301a', '#a16c2c', '#f5c242', '#be123c', '#6d28d9', '#e2e8f0'];
  const outfitColors = ['#f472b6', '#f8fafc', '#fbbf24', '#38bdf8', '#34d399', '#a78bfa', '#e11d48', '#8d5524'];
  const bottomColors = ['#7e22ce', '#be185d', '#1e40af', '#065f46', '#92400e', '#b91c1c', '#334155', '#d97706'];

  let selGender = 'female';
  let selSkin = skinColors[1];
  let selHair = hairColors[0];
  let selOutfit = outfitColors[0];
  let selBottom = bottomColors[0];
  let previewDirIdx = 0;
  const previewDirs = ['down', 'right', 'up', 'left'];
  let hasJoinedRoom = false;

  function setupSwatches(id, list, defaultIdx, onPick, allowCustom = false) {
    const container = document.getElementById(id);
    list.forEach((col, i) => {
      const d = document.createElement('div');
      d.className = 'swatch' + (i === defaultIdx ? ' active' : '');
      d.style.background = col;
      d.onclick = () => {
        container.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        d.classList.add('active');
        onPick(col);
        renderPreview();
      };
      container.appendChild(d);
    });

    if (allowCustom) {
      const wrap = document.createElement('label');
      wrap.className = 'color-picker-wrap';
      wrap.title = 'เลือกสีเองได้อิสระ';

  renderPreview();

  // ==================== AUTHORITATIVE NETCODE ARCHITECTURE ====================
  // - Host-authoritative 20Hz simulation tick (50ms)
  // - Client-side prediction with sequence-numbered input ring buffer & smooth reconciliation
  // - Snapshot interpolation buffer (~90ms render delay) for jitter-free remote players
  // - Quantized integer coordinates & bitpacked flags for minimal bandwidth footprint
  const TICK_RATE = 20;
  const TICK_DT = 1 / TICK_RATE;
  const MOVE_SPEED = 72; // logical px/sec in 480x270 space
  const INTERP_DELAY_MS = 90;

  let peer = null;
  let isHost = false;
  let hostConn = null;
  const guestConns = new Map();

  let selfId = null;
  let roomCode = initialRoom;
  const players = new Map();
  let krathongs = [];
  const lanterns = [];
  const emotes = [];
  const bubbles = new Map();
  const seenEvents = new Set();
  let holdingHands = false;

  // Client-side prediction & reconciliation state
  let inputSeq = 0;
  const pendingInputs = [];
  let reconcileErrX = 0;
  let reconcileErrY = 0;
  let measuredRtt = 0;
  let lastPingSent = 0;

  const keys = {};
  let clickTarget = null;

  const PEER_OPTS = {
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' }
      ]
    }
  };

  const DIR_TO_CODE = { down: 0, left: 1, right: 2, up: 3 };
  const CODE_TO_DIR = ['down', 'left', 'right', 'up'];

  function packFlags(dir, moving, kneeling) {
    return (DIR_TO_CODE[dir] || 0) | (moving ? 4 : 0) | (kneeling ? 8 : 0);
  }
  function unpackFlags(flags) {
    return {
      dir: CODE_TO_DIR[flags & 3] || 'down',
      moving: Boolean(flags & 4),
      kneeling: Boolean(flags & 8)
    };
  }

  function showToast(html, duration = 4500) {
    const el = document.getElementById('toast');
    el.innerHTML = html;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = 'none'; }, duration);
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }

  function appendChat(sender, text, color = '#34d399') {
    const box = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.innerHTML = `<strong style="color:${color}">${esc(sender)}:</strong> ${esc(text)}`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function updateHudCount() {
    document.getElementById('hud-players').textContent = players.size;
  }

  function clampPlayablePos(x, y) {
    // Playable riverside promenade & meadow bounds in 480x270 space
    let cx = Math.max(66, Math.min(458, x));
    let cy = Math.max(82, Math.min(158, y));
    // Keep out of the stone altar monument core
    if (cx > 235 && cx < 305 && cy < 95) {
      cy = 95;
    }
    return { x: cx, y: cy };
  }

  function stepMovement(state, vx, vy, dt) {
    if (vx === 0 && vy === 0) {
      state.moving = false;
      return;
    }
    const len = Math.hypot(vx, vy);
    const nx = vx / len;
    const ny = vy / len;
    const clamped = clampPlayablePos(state.x + nx * MOVE_SPEED * dt, state.y + ny * MOVE_SPEED * dt);
    state.x = clamped.x;
    state.y = clamped.y;
    state.moving = true;
    state.dir = Math.abs(nx) > Math.abs(ny) ? (nx > 0 ? 'right' : 'left') : (ny > 0 ? 'down' : 'up');
  }

  // ==================== P2P NETWORKING ====================
  function hostBroadcast(msg, exceptId = null) {
    guestConns.forEach((conn, pid) => {
      if (pid !== exceptId && conn.open) {
        conn.send(msg);
      }
    });
  }

  function sendPacket(msg) {
    if (isHost) {
      hostBroadcast(msg);
    } else if (hostConn && hostConn.open) {
      hostConn.send(msg);
    }
  }

  function makePlayerObj(id, name, avatar) {
    const sx = 205 + Math.floor(Math.random() * 70);
    const sy = 136 + Math.floor(Math.random() * 14);
    return {
      id,
      name: (name || 'นักเดินทาง').slice(0, 16),
      avatar,
      x: sx,
      y: sy,
      renderX: sx,
      renderY: sy,
      dir: 'down',
      moving: false,
      kneeling: false,
      lastAckSeq: 0,
      lastSentX: sx,
      lastSentY: sy,
      lastSentFlags: 0,
      snapshots: [{ t: performance.now(), x: sx, y: sy, dir: 'down', moving: false, kneeling: false }]
    };
  }

  function joinRoom(rawRoom, rawName, avatar) {
    roomCode = (rawRoom || 'LOVE2026').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'LOVE2026';
    const hostId = 'katong-pakk49-v3-' + roomCode;
    document.getElementById('hud-room').textContent = roomCode;

    const btnStart = document.getElementById('btn-start');
    btnStart.disabled = true;
    btnStart.textContent = 'กำลังเข้าสู่ริมแม่น้ำ...';

    peer = new Peer(hostId, PEER_OPTS);

    peer.on('open', (id) => {
      isHost = true;
      selfId = id;
      hasJoinedRoom = true;
      const me = makePlayerObj(selfId, rawName, avatar);
      players.set(selfId, me);
      updateHudCount();

      document.getElementById('status-dot').textContent = '🟢';
      document.getElementById('hud-net').textContent = 'Host • 20Hz';
      document.getElementById('modal-join').style.display = 'none';
      appendChat('ระบบ', `เปิดห้อง ${roomCode} แล้ว! กดปุ่ม "🔗 ชวนแฟน" ด้านบนส่งให้แฟนได้เลย 💕`, '#fbbf24');

      peer.on('connection', (conn) => {
        conn.on('open', () => {
          guestConns.set(conn.peer, conn);
        });
        conn.on('data', (data) => onHostData(conn, data));
        conn.on('close', () => {
          guestConns.delete(conn.peer);
          const p = players.get(conn.peer);
          if (p) {
            appendChat('ระบบ', `${p.name} ออกจากห้องแล้ว`, '#94a3b8');
            players.delete(conn.peer);
            updateHudCount();
            hostBroadcast({ t: 'L', id: conn.peer });
          }
        });
      });
    });

    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        peer.destroy();
        connectGuest(hostId, rawName, avatar);
      } else {
        btnStart.disabled = false;
        btnStart.textContent = 'เข้าสู่ริมแม่น้ำ ✨';
        showToast('⚠️ เชื่อมต่อไม่สำเร็จ กรุณากดเข้าห้องอีกครั้ง (' + err.type + ')');
      }
    });
  }

  function connectGuest(hostId, rawName, avatar) {
    isHost = false;
    peer = new Peer(PEER_OPTS);

    peer.on('open', (id) => {
      selfId = id;
      const me = makePlayerObj(selfId, rawName, avatar);
      players.set(selfId, me);
      updateHudCount();

      hostConn = peer.connect(hostId, { reliable: true });

      hostConn.on('open', () => {
        hasJoinedRoom = true;
        document.getElementById('status-dot').textContent = '🟢';
        document.getElementById('modal-join').style.display = 'none';
        hostConn.send({ t: 'J', p: { id: me.id, name: me.name, avatar: me.avatar, x: me.x, y: me.y } });
        appendChat('ระบบ', `เชื่อมต่อเข้าห้อง ${roomCode} สำเร็จแล้ว 💕`, '#fbbf24');
      });

      hostConn.on('data', (data) => onGuestData(data));

      hostConn.on('close', () => {
        document.getElementById('status-dot').textContent = '🔴';
        appendChat('ระบบ', 'เจ้าของห้องปิดหน้าเว็บไปแล้ว กรุณารีเฟรชเพื่อสร้างห้องใหม่', '#f87171');
      });
    });

    peer.on('error', (err) => {
      const btnStart = document.getElementById('btn-start');
      btnStart.disabled = false;
      btnStart.textContent = 'เข้าสู่ริมแม่น้ำ ✨';
      showToast('⚠️ ไม่พบห้องหรือเน็ตขัดข้อง ลองกดอีกครั้ง (' + err.type + ')');
    });
  }

  function onHostData(conn, msg) {
    if (!msg || !msg.t) return;

    if (msg.t === 'J' && msg.p) {
      const np = makePlayerObj(conn.peer, msg.p.name, msg.p.avatar);
      const clamped = clampPlayablePos(msg.p.x, msg.p.y);
      np.x = np.renderX = clamped.x;
      np.y = np.renderY = clamped.y;
      players.set(np.id, np);
      updateHudCount();
      appendChat('ระบบ', `${np.name} เดินทางมาถึงริมแม่น้ำแล้ว 💕`, '#f472b6');

      conn.send({
        t: 'I',
        players: Array.from(players.values()).map(pl => ({
          id: pl.id, name: pl.name, avatar: pl.avatar,
          x: Math.round(pl.x), y: Math.round(pl.y),
          f: packFlags(pl.dir, pl.moving, pl.kneeling)
        })),
        krathongs
      });
      hostBroadcast({
        t: 'N',
        p: { id: np.id, name: np.name, avatar: np.avatar, x: Math.round(np.x), y: Math.round(np.y) }
      }, conn.peer);

    } else if (msg.t === 'U') {
      // Authoritative validation of client input packet
      const p = players.get(conn.peer);
      if (p) {
        const flags = unpackFlags(msg.f || 0);
        const clamped = clampPlayablePos(msg.x, msg.y);
        // Anti-teleport speed check (allow generous 240 px/s burst for latency jitter)
        const dist = Math.hypot(clamped.x - p.x, clamped.y - p.y);
        if (dist < 110) {
          p.x = clamped.x;
          p.y = clamped.y;
        }
        p.dir = flags.dir;
        p.moving = flags.moving;
        p.kneeling = flags.kneeling;
        if (typeof msg.s === 'number') p.lastAckSeq = msg.s;
        p.snapshots.push({ t: performance.now(), x: p.x, y: p.y, dir: p.dir, moving: p.moving, kneeling: p.kneeling });
        if (p.snapshots.length > 16) p.snapshots.shift();
      }

    } else if (msg.t === 'P') {
      conn.send({ t: 'Q', ts: msg.ts });

    } else if (msg.t === 'A') {
      const p = players.get(conn.peer);
      if (p && msg.av) {
        p.avatar = msg.av;
        hostBroadcast({ t: 'A', id: conn.peer, av: p.avatar }, conn.peer);
      }

    } else if (msg.t === 'C') {
      if (seenEvents.has(msg.eid)) return;
      seenEvents.add(msg.eid);
      const p = players.get(conn.peer);
      const name = p ? p.name : 'เพื่อน';
      appendChat(name, msg.txt);
      bubbles.set(conn.peer, { text: msg.txt, exp: Date.now() + 5500 });
      hostBroadcast({ t: 'C', eid: msg.eid, id: conn.peer, txt: msg.txt }, conn.peer);

    } else if (msg.t === 'E') {
      if (seenEvents.has(msg.eid)) return;
      seenEvents.add(msg.eid);
      spawnEmote(conn.peer, msg.em);
      hostBroadcast({ t: 'E', eid: msg.eid, id: conn.peer, em: msg.em }, conn.peer);

    } else if (msg.t === 'K') {
      if (seenEvents.has(msg.k.id)) return;
      seenEvents.add(msg.k.id);
      krathongs.push(msg.k);
      if (krathongs.length > 60) krathongs.shift();
      appendChat('🪷', `${msg.k.owner} ลอยกระทง: "${msg.k.wish}"`, '#fde047');
      hostBroadcast({ t: 'K', k: msg.k }, conn.peer);

    } else if (msg.t === 'O') {
      if (seenEvents.has(msg.eid)) return;
      seenEvents.add(msg.eid);
      spawnLantern(msg.x, msg.owner);
      hostBroadcast({ t: 'O', eid: msg.eid, x: msg.x, owner: msg.owner }, conn.peer);
    }
  }

  function onGuestData(msg) {
    if (!msg || !msg.t) return;

    if (msg.t === 'I') {
      msg.players.forEach(sp => {
        if (sp.id === selfId) return;
        const fl = unpackFlags(sp.f || 0);
        const np = makePlayerObj(sp.id, sp.name, sp.avatar);
        np.x = np.renderX = sp.x;
        np.y = np.renderY = sp.y;
        np.dir = fl.dir; np.moving = fl.moving; np.kneeling = fl.kneeling;
        players.set(np.id, np);
      });
      krathongs = msg.krathongs || [];
      updateHudCount();

    } else if (msg.t === 'N' && msg.p) {
      if (msg.p.id !== selfId) {
        const np = makePlayerObj(msg.p.id, msg.p.name, msg.p.avatar);
        np.x = np.renderX = msg.p.x;
        np.y = np.renderY = msg.p.y;
        players.set(np.id, np);
        updateHudCount();
        appendChat('ระบบ', `${np.name} เข้ามาในห้องแล้ว 💕`, '#f472b6');
      }

    } else if (msg.t === 'S') {
      // Authoritative world state snapshot from Host
      const now = performance.now();
      msg.ps.forEach(sp => {
        const fl = unpackFlags(sp.f || 0);
        if (sp.id === selfId) {
          // Server Reconciliation for local player
          const me = players.get(selfId);
          if (!me) return;
          while (pendingInputs.length && pendingInputs[0].seq <= sp.ack) {
            pendingInputs.shift();
          }
          // Re-simulate unacknowledged inputs from authoritative server state
          const sim = { x: sp.x, y: sp.y, dir: fl.dir, moving: fl.moving };
          for (let i = 0; i < pendingInputs.length; i++) {
            stepMovement(sim, pendingInputs[i].vx, pendingInputs[i].vy, pendingInputs[i].dt);
          }
          const errX = sim.x - me.x;
          const errY = sim.y - me.y;
          if (Math.hypot(errX, errY) > 1.5) {
            reconcileErrX += (me.x - sim.x);
            reconcileErrY += (me.y - sim.y);
            me.x = sim.x;
            me.y = sim.y;
          }
        } else {
          let p = players.get(sp.id);
          if (!p) {
            p = makePlayerObj(sp.id, 'แฟน', {});
            p.x = p.renderX = sp.x;
            p.y = p.renderY = sp.y;
            players.set(sp.id, p);
            updateHudCount();
          }
          p.x = sp.x; p.y = sp.y;
          p.dir = fl.dir; p.moving = fl.moving; p.kneeling = fl.kneeling;
          p.snapshots.push({ t: now, x: sp.x, y: sp.y, dir: fl.dir, moving: fl.moving, kneeling: fl.kneeling });
          if (p.snapshots.length > 16) p.snapshots.shift();
        }
      });

    } else if (msg.t === 'Q') {
      measuredRtt = Math.max(1, Math.round(performance.now() - msg.ts));
      document.getElementById('hud-net').textContent = `20Hz • ${measuredRtt}ms`;

    } else if (msg.t === 'A') {
      const p = players.get(msg.id);
      if (p && msg.id !== selfId && msg.av) {
        p.avatar = msg.av;
      }

    } else if (msg.t === 'C') {
      if (seenEvents.has(msg.eid)) return;
      seenEvents.add(msg.eid);
      const p = players.get(msg.id);
      appendChat(p ? p.name : 'แฟน', msg.txt);
      bubbles.set(msg.id, { text: msg.txt, exp: Date.now() + 5500 });

    } else if (msg.t === 'E') {
      if (seenEvents.has(msg.eid)) return;
      seenEvents.add(msg.eid);
      spawnEmote(msg.id, msg.em);

    } else if (msg.t === 'K') {
      if (seenEvents.has(msg.k.id)) return;
      seenEvents.add(msg.k.id);
      krathongs.push(msg.k);
      if (krathongs.length > 60) krathongs.shift();
      appendChat('🪷', `${msg.k.owner} ลอยกระทง: "${msg.k.wish}"`, '#fde047');

    } else if (msg.t === 'O') {
      if (seenEvents.has(msg.eid)) return;
      seenEvents.add(msg.eid);
      spawnLantern(msg.x, msg.owner);

    } else if (msg.t === 'L') {
      const p = players.get(msg.id);
      if (p) appendChat('ระบบ', `${p.name} ออกจากห้องแล้ว`, '#94a3b8');
      players.delete(msg.id);
      updateHudCount();
    }
  }

  function spawnEmote(playerId, emoji) {
    const p = players.get(playerId);
    if (!p) return;
    emotes.push({ x: p.renderX, y: p.renderY - 26, emoji, life: 1.0 });

  // ==================== UI EVENTS ====================

  function drawKrathong(k, t) {
    const bob = Math.sin((t + k.seed) / 340) * 1.2;
    const x = Math.round(k.x);
    const y = Math.round(k.y + bob);

    // Emerald-gold water glow aura (matching image_f461e1.jpg)
    const aura = ctx.createRadialGradient(x, y, 1, x, y, 15);
    aura.addColorStop(0, 'rgba(52, 211, 153, 0.58)');
    aura.addColorStop(0.55, 'rgba(253, 224, 71, 0.22)');
    aura.addColorStop(1, 'rgba(52, 211, 153, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(x, y, 15, 0, Math.PI * 2);
    ctx.fill();

    if (k.style === 'raft') {
      px(ctx, x - 7, y - 1, 14, 4, '#5c3419');
      px(ctx, x - 6, y - 2, 12, 3, '#92400e');
      px(ctx, x - 5, y - 2, 10, 1, '#ca8a04');
    } else if (k.style === 'leaf') {
      px(ctx, x - 6, y - 2, 12, 4, '#15803d');
      px(ctx, x - 5, y - 1, 10, 2, '#22c55e');
    } else if (k.style === 'heart') {
      px(ctx, x - 5, y - 3, 4, 3, '#f43f5e');
      px(ctx, x + 1, y - 3, 4, 3, '#f43f5e');
      px(ctx, x - 4, y - 1, 8, 2, '#fb7185');
      px(ctx, x - 2, y + 1, 4, 1, '#f43f5e');
    } else {
      // Lotus krathong
      px(ctx, x - 6, y - 1, 12, 3, '#15803d');
      px(ctx, x - 5, y - 3, 10, 3, '#f472b6');
      px(ctx, x - 3, y - 4, 6, 2, '#fbcfe8');
    }

    // Candle & flickering flame
    px(ctx, x - 1, y - 7, 2, 4, '#ffffff');
    const fl = Math.round(Math.sin(t / 75 + k.seed));
    px(ctx, x - 1, y - 10 + fl, 2, 3, k.candleColor || '#fde047');
  }

  // ==================== 16-BIT CHIBI CHARACTER RENDERER (image_f461c0.png STYLE) ====================
  // Compact ~16x22 pixel grid with crisp dark-brown pixel outline (#24140e), big cute head,
  // vertical pill eyes, side ears, and authentic Thai traditional costumes!
  function drawChibiCharacter(c, p, t, isPreview = false) {
    const x = Math.round(p.renderX);
    const y = Math.round(p.renderY);
    const stepPhase = p.moving ? Math.sin(t / 85) : 0;
    const walkBob = p.moving ? (Math.abs(stepPhase) > 0.5 ? 1 : 0) : 0;
    const squat = p.kneeling ? 3 : 0;

    // Ground shadow
    c.fillStyle = 'rgba(0, 0, 0, 0.36)';
    c.fillRect(x - 6, y - 1, 12, 3);

    const by = y - walkBob + squat;
    const av = p.avatar || {};
    const gender = av.gender || 'female';
    const outfit = av.outfitStyle || 'chakkri';
    const topCol = av.outfitColor || '#f472b6';
    const botCol = av.bottomColor || '#7e22ce';
    const skin = av.skin || '#ffdbac';
    const hairCol = av.hairColor || '#2b1910';
    const OL = '#24140e'; // Crisp dark pixel outline (like image_f461c0.png)

    // 1. Legs / Shoes with 2-frame walk step
    const leftStep = p.moving && stepPhase > 0.35 ? -1 : 0;
    const rightStep = p.moving && stepPhase < -0.35 ? -1 : 0;

    // Outline around feet/legs
    px(c, x - 5, by - 4 + leftStep, 4, 4, OL);
    px(c, x + 1, by - 4 + rightStep, 4, 4, OL);
    // Skin ankles + dark sandals/shoes
    px(c, x - 4, by - 4 + leftStep, 2, 2, skin);
    px(c, x + 2, by - 4 + rightStep, 2, 2, skin);
    px(c, x - 4, by - 2 + leftStep, 2, 1, '#451a03');
    px(c, x + 2, by - 2 + rightStep, 2, 1, '#451a03');

    // 2. Torso & Arms Outer Silhouette (14x9 outer -> 12x7 inner)
    px(c, x - 7, by - 12, 14, 8, OL);
    // Arms (skin default, overridden if long-sleeved outfit)
    px(c, x - 6, by - 11, 2, 5, skin);
    px(c, x + 4, by - 11, 2, 5, skin);

    // 3. Thai Traditional Outfits (inside 8x7 inner body box: x-4..x+3, by-12..by-5)
    if (outfit === 'chakkri') {
      // ชุดไทยจักรี: สไบเฉียงเปิดไหล่ + เข็มขัดทอง + ผ้าถุงหน้านาง
      px(c, x - 4, by - 12, 8, 4, skin);
      // Diagonal Sbai sash
      px(c, x - 4, by - 12, 4, 4, topCol);
      px(c, x - 2, by - 11, 5, 3, topCol);
      px(c, x - 1, by - 12, 1, 4, '#fde047'); // Gold Sbai border
      // Gold belt
      px(c, x - 4, by - 8, 8, 1, '#fde047');
      // Long Pha Sin skirt
      px(c, x - 5, by - 7, 10, 5, OL);
      px(c, x - 4, by - 7, 8, 4, botCol);
      px(c, x - 1, by - 7, 2, 4, '#facc15'); // Gold pleated front panel

    } else if (outfit === 'siwalai') {
      // ชุดไทยศิวาลัย: เสื้อแขนยาวขลิบทอง + ผ้าถุงยกทอง
      px(c, x - 4, by - 12, 8, 4, topCol);
      px(c, x - 6, by - 11, 2, 4, topCol); // long sleeves
      px(c, x + 4, by - 11, 2, 4, topCol);
      px(c, x - 2, by - 12, 4, 1, '#fde047'); // gold collar
      px(c, x - 4, by - 8, 8, 1, '#fde047'); // gold belt
      px(c, x - 5, by - 7, 10, 5, OL);
      px(c, x - 4, by - 7, 8, 4, botCol);
      px(c, x - 4, by - 4, 8, 1, '#facc15'); // gold hem

    } else if (outfit === 'raj_pattern') {
      // ชุดไทยราชปะแตน + โจงกระเบน
      px(c, x - 4, by - 12, 8, 5, topCol);
      px(c, x - 6, by - 11, 2, 4, topCol); // long sleeves
      px(c, x + 4, by - 11, 2, 4, topCol);
      px(c, x - 1, by - 12, 2, 4, '#eab308'); // gold collar & buttons
      // Puffy Chong Kraben
      px(c, x - 5, by - 7, 10, 4, OL);
      px(c, x - 4, by - 7, 8, 3, botCol);
      px(c, x - 1, by - 5, 2, 1, OL); // leg split

    } else if (outfit === 'lanna') {
      // ชุดไทยล้านนา: เสื้อปั๊ดป้ายข้าง + ผ้าซิ่นตีนจก
      px(c, x - 4, by - 12, 8, 4, topCol);
      px(c, x - 6, by - 11, 2, 4, topCol);
      px(c, x + 4, by - 11, 2, 4, topCol);
      px(c, x - 1, by - 12, 1, 3, '#fde047');
      px(c, x, by - 10, 3, 1, '#fde047');
      px(c, x - 5, by - 7, 10, 5, OL);
      px(c, x - 4, by - 7, 8, 4, botCol);
      px(c, x - 4, by - 5, 8, 1, '#f43f5e'); // Tin Jok woven stripe
      px(c, x - 4, by - 4, 8, 1, '#fde047');

    } else if (outfit === 'boran') {
      // ชุดไทยโบราณ (หญิง: ผ้าแถบ+โจงกระเบน / ชาย: เสื้อม่อฮ่อม+ผ้าขาวม้า+โจงกระเบน)
      if (gender === 'female') {
        px(c, x - 4, by - 12, 8, 5, skin);
        px(c, x - 4, by - 11, 8, 3, topCol); // ผ้าแถบ
      } else {
        px(c, x - 4, by - 12, 8, 5, topCol);
        px(c, x - 6, by - 11, 2, 3, topCol);
        px(c, x + 4, by - 11, 2, 3, topCol);
        // Pha Khao Ma sash (ผ้าขาวม้าพาดบ่า)
        px(c, x - 3, by - 12, 2, 5, '#ef4444');
        px(c, x - 3, by - 11, 1, 1, '#fde047');
        px(c, x - 2, by - 9, 1, 1, '#fde047');
      }
      px(c, x - 5, by - 7, 10, 4, OL);
      px(c, x - 4, by - 7, 8, 3, botCol);
      px(c, x - 1, by - 5, 2, 1, OL);

    } else {
      // ชุดชนเผ่าพื้นเมือง
      px(c, x - 4, by - 12, 8, 7, topCol);
      px(c, x - 2, by - 11, 4, 1, '#fef3c7'); // bone necklace
      px(c, x - 4, by - 6, 8, 2, botCol); // fur hem
    }

    // 4. Chunky Chibi Head (14x12 outer -> 12x10 inner, matching image_f461c0.png!)
    px(c, x - 7, by - 23, 14, 11, OL);
    px(c, x - 6, by - 24, 12, 1, OL);
    // Cute side pixel ears (just like image_f461c0.png!)
    px(c, x - 8, by - 18, 1, 3, OL);
    px(c, x + 7, by - 18, 1, 3, OL);
    px(c, x - 7, by - 18, 1, 2, skin);
    px(c, x + 6, by - 18, 1, 2, skin);

    // Face fill
    px(c, x - 6, by - 22, 12, 9, skin);

    // 5. Eyes & Expression (Vertical pill eyes like image_f461c0.png)
    if (p.dir !== 'up') {
      const eo = p.dir === 'left' ? -1 : p.dir === 'right' ? 1 : 0;
      px(c, x - 4 + eo, by - 18, 2, 3, OL);
      px(c, x + 2 + eo, by - 18, 2, 3, OL);

      if (gender === 'female') {
        // Rosy cheeks
        px(c, x - 5 + eo, by - 15, 2, 1, 'rgba(244, 63, 94, 0.5)');
        px(c, x + 3 + eo, by - 15, 2, 1, 'rgba(244, 63, 94, 0.5)');
      }
    }

    // 6. Hairstyles & Headpieces (with crisp dark outline!)
    const hs = Number(av.hairStyle || 0);
    if (hs === 8) {
      // Wolf hood
      px(c, x - 7, by - 25, 14, 5, OL);
      px(c, x - 7, by - 27, 3, 2, OL);
      px(c, x + 4, by - 27, 3, 2, OL);
      px(c, x - 6, by - 24, 12, 3, '#94a3b8');
      px(c, x - 6, by - 26, 2, 2, '#cbd5e1');
      px(c, x + 4, by - 26, 2, 2, '#cbd5e1');
      px(c, x - 7, by - 21, 2, 7, '#64748b');
      px(c, x + 5, by - 21, 2, 7, '#64748b');
    } else {
      // Top hair crown + bangs (matching image_f461c0.png)
      px(c, x - 6, by - 23, 12, 3, hairCol);
      px(c, x - 5, by - 20, 2, 1, hairCol);
      px(c, x, by - 20, 2, 1, hairCol);
      px(c, x + 4, by - 20, 2, 1, hairCol);

      if (p.dir === 'up') {
        px(c, x - 6, by - 22, 12, 8, hairCol);
      }

      if (hs === 0) {
        // Short neat sideburns
        px(c, x - 6, by - 20, 1, 3, hairCol);
        px(c, x + 5, by - 20, 1, 3, hairCol);
      } else if (hs === 1) {
        // Long straight hair (like bottom-left girl in image_f461c0.png)
        px(c, x - 8, by - 20, 3, 11, OL);
        px(c, x + 5, by - 20, 3, 11, OL);
        px(c, x - 7, by - 20, 2, 10, hairCol);
        px(c, x + 5, by - 20, 2, 10, hairCol);
      } else if (hs === 2) {
        // Shoulder-length bob
        px(c, x - 8, by - 20, 3, 7, OL);
        px(c, x + 5, by - 20, 3, 7, OL);
        px(c, x - 7, by - 20, 2, 6, hairCol);
        px(c, x + 5, by - 20, 2, 6, hairCol);
      } else if (hs === 3) {
        // Thai Chignon Bun + Gold Hairpin (เกล้ามวยไทย + ปิ่นทอง)
        px(c, x - 4, by - 27, 8, 4, OL);
        px(c, x - 3, by - 26, 6, 3, hairCol);
        px(c, x - 4, by - 24, 8, 1, '#fde047'); // Gold tiara band
        px(c, x + 3, by - 27, 3, 1, '#fde047'); // Gold hairpin
      } else if (hs === 4) {
        // Cute Pigtails (like top-right blonde girl in image_f461c0.png!)
        px(c, x - 10, by - 21, 3, 5, OL);
        px(c, x + 7, by - 21, 3, 5, OL);
        px(c, x - 9, by - 20, 2, 3, hairCol);
        px(c, x + 7, by - 20, 2, 3, hairCol);
      } else if (hs === 5) {
        // Twin braids with ribbons
        px(c, x - 8, by - 19, 3, 9, OL);
        px(c, x + 5, by - 19, 3, 9, OL);
        px(c, x - 7, by - 19, 2, 8, hairCol);
        px(c, x + 5, by - 19, 2, 8, hairCol);
        px(c, x - 7, by - 13, 2, 1, '#f43f5e');
        px(c, x + 5, by - 13, 2, 1, '#f43f5e');
      } else if (hs === 6) {
        // Center-part Korean style
        px(c, x - 7, by - 20, 2, 5, hairCol);
        px(c, x + 5, by - 20, 2, 5, hairCol);
        px(c, x - 1, by - 21, 2, 1, skin);
      } else if (hs === 7) {
        // Flower crown + bob
        px(c, x - 7, by - 20, 2, 6, hairCol);
        px(c, x + 5, by - 20, 2, 6, hairCol);
        px(c, x - 5, by - 24, 2, 2, '#f43f5e');
        px(c, x - 1, by - 24, 2, 2, '#facc15');
        px(c, x + 3, by - 24, 2, 2, '#38bdf8');
      }
    }

    if (isPreview) return;

    // 7. Crisp Nameplate
    c.font = 'bold 7px Prompt, sans-serif';
    c.textAlign = 'center';
    const nw = Math.ceil(c.measureText(p.name).width) + 6;
    c.fillStyle = 'rgba(11, 19, 30, 0.82)';
    c.fillRect(x - Math.floor(nw / 2), by - 35, nw, 9);
    c.fillStyle = p.id === selfId ? '#fde047' : '#ffffff';
    c.fillText(p.name, x, by - 28);

    // 8. Overhead Chat Bubble
    const b = bubbles.get(p.id);
    if (b && b.exp > Date.now()) {
      c.font = '7px Prompt, sans-serif';
      const bw = Math.min(120, Math.ceil(c.measureText(b.text).width) + 10);
      const bx = x - Math.floor(bw / 2);
      const byBubble = by - 49;
      c.fillStyle = '#ffffff';
      c.fillRect(bx, byBubble, bw, 12);
      c.strokeStyle = '#24140e';
      c.lineWidth = 1;
      c.strokeRect(bx, byBubble, bw, 12);
      c.fillStyle = '#0f172a';
      c.fillText(b.text, x, byBubble + 8, 112);
    }
  }

  function drawLantern(l, t) {
    const sway = Math.sin((t + l.seed) / 400) * 2.5;
    const x = Math.round(l.x + sway);
    const y = Math.round(l.y);

    const glow = ctx.createRadialGradient(x, y, 1, x, y, 14);
    glow.addColorStop(0, 'rgba(251, 146, 60, 0.75)');
    glow.addColorStop(1, 'rgba(251, 146, 60, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, 14, 0, Math.PI * 2);
    ctx.fill();

    px(ctx, x - 3, y - 5, 6, 8, '#ea580c');
    px(ctx, x - 2, y - 4, 4, 6, '#fb923c');
    px(ctx, x - 1, y - 2, 2, 4, '#fef08a');
  }

  // ==================== FIXED-TIMESTEP SIMULATION & RENDER LOOP ====================
  let prevTime = performance.now();
  let netAcc = 0;

  function frame(now) {
    const dt = Math.min(0.05, (now - prevTime) / 1000);
    prevTime = now;

    // 1. Local Player Input & Client-Side Prediction
    const me = players.get(selfId);
    let stepVx = 0, stepVy = 0;

    if (me && !me.kneeling) {
      if (holdingHands && players.size > 1) {
        let partner = null;
        for (const [id, pl] of players.entries()) {
          if (id !== selfId) { partner = pl; break; }
        }
        if (partner) {
          const dest = clampPlayablePos(partner.renderX + 14, partner.renderY);
          const d = Math.hypot(dest.x - me.x, dest.y - me.y);
          if (d > 2) {
            stepVx = (dest.x - me.x) / d;
            stepVy = (dest.y - me.y) / d;
            stepMovement(me, stepVx, stepVy, dt);
          } else {
            me.moving = false;
            me.dir = partner.dir;
          }
        }
      } else {
        if (keys['w'] || keys['arrowup']) stepVy -= 1;
        if (keys['s'] || keys['arrowdown']) stepVy += 1;
        if (keys['a'] || keys['arrowleft']) stepVx -= 1;
        if (keys['d'] || keys['arrowright']) stepVx += 1;

        if (stepVx !== 0 || stepVy !== 0) {
          stepMovement(me, stepVx, stepVy, dt);
        } else if (clickTarget) {
          const d = Math.hypot(clickTarget.x - me.x, clickTarget.y - me.y);
          if (d > 2) {
            stepVx = (clickTarget.x - me.x) / d;
            stepVy = (clickTarget.y - me.y) / d;
            stepMovement(me, stepVx, stepVy, dt);
          } else {
            clickTarget = null;
            me.moving = false;
          }
        } else {
          me.moving = false;
        }
      }

      if (!isHost && (stepVx !== 0 || stepVy !== 0)) {
        inputSeq++;
        pendingInputs.push({ seq: inputSeq, vx: stepVx, vy: stepVy, dt });
        if (pendingInputs.length > 60) pendingInputs.shift();
      }
    }

    // Smoothly decay positional reconciliation offset (prevents rubber-banding)
    reconcileErrX *= Math.pow(0.05, dt);
    reconcileErrY *= Math.pow(0.05, dt);
    if (me) {
      me.renderX = me.x + reconcileErrX;
      me.renderY = me.y + reconcileErrY;
    }

    // 2. Fixed 20Hz Network Tick (Bandwidth-Budgeted & Quantized)
    netAcc += dt;
    if (netAcc >= TICK_DT) {
      netAcc %= TICK_DT;

      if (me) {
        const qx = Math.round(me.x);
        const qy = Math.round(me.y);
        const qf = packFlags(me.dir, me.moving, me.kneeling);

        if (!isHost) {
          // Only transmit movement packet when state changed (delta compression)
          if (qx !== me.lastSentX || qy !== me.lastSentY || qf !== me.lastSentFlags) {
            me.lastSentX = qx; me.lastSentY = qy; me.lastSentFlags = qf;
            sendPacket({ t: 'U', s: inputSeq, x: qx, y: qy, f: qf });
          }
          if (now - lastPingSent > 2000) {
            lastPingSent = now;
            sendPacket({ t: 'P', ts: now });
          }
        } else if (guestConns.size > 0) {
          // Host broadcasts authoritative snapshot batch to all connected guests
          const ps = [];
          players.forEach(pl => {
            ps.push({
              id: pl.id,
              x: Math.round(pl.x),
              y: Math.round(pl.y),
              f: packFlags(pl.dir, pl.moving, pl.kneeling),
              ack: pl.lastAckSeq || 0
            });
          });
          hostBroadcast({ t: 'S', ps });
        }
      }
    }

    // 3. Snapshot Interpolation for Remote Players (Smooth across jitter/packet loss)
    const renderTime = now - INTERP_DELAY_MS;
    players.forEach(p => {
      if (p.id === selfId) return;
      const snaps = p.snapshots;
      if (snaps && snaps.length >= 2) {
        while (snaps.length > 2 && snaps[1].t <= renderTime) {
          snaps.shift();
        }
        const s0 = snaps[0];
        const s1 = snaps[1];
        if (s1.t > s0.t) {
          const alpha = Math.max(0, Math.min(1.25, (renderTime - s0.t) / (s1.t - s0.t)));
          p.renderX = s0.x + (s1.x - s0.x) * alpha;
          p.renderY = s0.y + (s1.y - s0.y) * alpha;
        } else {
          p.renderX += (p.x - p.renderX) * 0.28;
          p.renderY += (p.y - p.renderY) * 0.28;
        }
      } else {
        p.renderX += (p.x - p.renderX) * 0.28;
        p.renderY += (p.y - p.renderY) * 0.28;
      }
    });

    // 4. Drift Krathongs & Lanterns
    for (let i = krathongs.length - 1; i >= 0; i--) {
      const k = krathongs[i];
      k.x += k.vx * 11 * dt;
      k.y += k.vy * 6 * dt;
      if (k.x > W + 30 || k.y > H + 30) krathongs.splice(i, 1);
    }

    for (let i = lanterns.length - 1; i >= 0; i--) {
      const l = lanterns[i];
      l.x += l.vx * 12 * dt;
      l.y += l.vy * 16 * dt;
      if (l.y < -25) lanterns.splice(i, 1);
    }

    // 5. Render Frame
    ctx.clearRect(0, 0, W, H);
    drawAnimatedScene(now);

    if (clickTarget) {
      ctx.strokeStyle = 'rgba(253, 224, 71, 0.85)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(clickTarget.x, clickTarget.y, 4 + Math.sin(now / 150), 2, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    krathongs.forEach(k => drawKrathong(k, now));

    // Depth-sort all characters (players + ambient villagers) by Y coordinate
    const allChars = [
      ...villageNpcs.map(n => ({ ...n, isNpc: true })),
      ...Array.from(players.values())
    ].sort((a, b) => a.renderY - b.renderY);

    allChars.forEach(ch => {
      if (ch.isNpc) {
        drawChibiCharacter(ctx, ch, now, true);
      } else {
        drawChibiCharacter(ctx, ch, now, false);
      }
    });

    // Floating heart when holding hands close to partner
    const realSorted = Array.from(players.values()).sort((a, b) => a.renderY - b.renderY);
    if (holdingHands && realSorted.length >= 2) {
      const p1 = realSorted[0];
      const p2 = realSorted[1];
      if (Math.hypot(p1.renderX - p2.renderX, p1.renderY - p2.renderY) < 26) {
        ctx.font = '8px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('💕', (p1.renderX + p2.renderX) / 2, Math.min(p1.renderY, p2.renderY) - 14 + Math.sin(now / 200));
      }
    }

    lanterns.forEach(l => drawLantern(l, now));

    // Fireflies
    fireflies.forEach((f, idx) => {
      const fx = Math.round(f.x + Math.sin(now / 900 + f.phase) * 6);
      const fy = Math.round(f.y + Math.cos(now / 700 + idx) * 4);
      const pulse = 0.45 + 0.55 * Math.sin(now / 320 + f.phase);
      ctx.fillStyle = `rgba(254, 240, 138, ${pulse.toFixed(2)})`;
      ctx.fillRect(fx, fy, 1, 1);
    });

    // Floating Emotes
    for (let i = emotes.length - 1; i >= 0; i--) {
      const em = emotes[i];
      em.y -= 18 * dt;
      em.life -= 0.75 * dt;
      if (em.life <= 0) {
        emotes.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, em.life);
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(em.emoji, em.x, em.y);
      ctx.restore();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
