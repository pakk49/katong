<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ลอยกระทงด้วยกัน • Real-time Pixel World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07131c;
      color: #f8fafc;
      user-select: none;
    }
    #game-wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #061018;
    }
    canvas#world {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: pointer;
    }

    /* HUD Top */
    .hud-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px;
      pointer-events: none;
      z-index: 15;
    }
    .pill {
      pointer-events: auto;
      background: rgba(13, 21, 32, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 7px 11px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      font-size: 13px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-primary { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-warm { background: linear-gradient(135deg, #f59e0b, #ea580c); }
    .btn-purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .btn-ghost { background: rgba(255, 255, 255, 0.13); }
    .btn-ghost.active {
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.55);
    }

    /* Toast */
    #toast {
      position: absolute;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 21, 32, 0.95);
      border: 1px solid #fbbf24;
      color: #fef3c7;
      padding: 9px 18px;
      border-radius: 14px;
      font-size: 13px;
      z-index: 25;
      display: none;
      text-align: center;
      max-width: 90vw;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
    }

    /* HUD Bottom */
    .hud-bottom {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
      pointer-events: none;
      z-index: 15;
    }
    .chat-panel {
      pointer-events: auto;
      width: 330px;
      max-width: 62vw;
      background: rgba(13, 21, 32, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
    .chat-messages {
      max-height: 92px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.45;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 0 4px;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    .chat-form {
      display: flex;
      gap: 6px;
    }
    .chat-form input {
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 9px;
      padding: 6px 10px;
      color: #fff;
      font-size: 13px;
      outline: none;
      user-select: text;
    }
    .chat-form input:focus { border-color: #34d399; }

    .right-controls {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .emote-bar {
      display: flex;
      gap: 4px;
      background: rgba(13, 21, 32, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 13px;
      padding: 5px 9px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
    .emote-btn {
      background: transparent;
      border: none;
      font-size: 20px;
      padding: 2px 5px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .emote-btn:hover { transform: scale(1.25); }

    /* Modals */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 11, 18, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 14px;
    }
    .card {
      background: #131f2e;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 20px;
      width: 450px;
      max-width: 100%;
      max-height: 93vh;
      overflow-y: auto;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
    }
    .card::-webkit-scrollbar { width: 5px; }
    .card::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    .card h2 {
      font-size: 20px;
      color: #fbbf24;
      margin-bottom: 4px;
    }
    .card p.sub {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .form-group { margin-bottom: 11px; }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 5px;
      font-weight: 500;
    }
    .form-group input[type="text"], .form-group select {
      width: 100%;
      background: #0b131d;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
      user-select: text;
    }
    .form-group input[type="text"]:focus, .form-group select:focus { border-color: #10b981; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 420px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    /* Gender Toggle */
    .gender-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .gender-btn {
      background: #0b131d;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      padding: 8px;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .gender-btn.active[data-gender="female"] {
      background: rgba(236, 72, 153, 0.22);
      border-color: #ec4899;
      color: #fbcfe8;
    }
    .gender-btn.active[data-gender="male"] {
      background: rgba(59, 130, 246, 0.22);
      border-color: #3b82f6;
      color: #bfdbfe;
    }

    /* Swatches + Color Picker */
    .swatches {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: center;
    }
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.18);
      transition: transform 0.12s, border-color 0.12s;
      flex-shrink: 0;
    }
    .swatch.active {
      border-color: #fff;
      transform: scale(1.16);
      box-shadow: 0 0 10px rgba(255,255,255,0.55);
    }
    .color-picker-wrap {
      position: relative;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px dashed rgba(255,255,255,0.45);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
    }
    .color-picker-wrap input[type="color"] {
      position: absolute;
      inset: -6px;
      width: 40px;
      height: 40px;
      opacity: 0;
      cursor: pointer;
    }

    /* Avatar Preview Box */
    .preview-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1b3147 0%, #0b131d 100%);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px;
      padding: 8px;
      margin-bottom: 12px;
      position: relative;
    }
    .preview-controls {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .mini-btn {
      background: rgba(255,255,255,0.12);
      border: none;
      color: #e2e8f0;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .mini-btn:hover { background: rgba(255,255,255,0.22); }
  </style>
</head>
<body>

<div id="game-wrap">
  <canvas id="world" width="960" height="540"></canvas>

  <!-- Top HUD -->
  <div class="hud-top">
    <div class="pill">
      <span id="status-dot" title="สถานะการเชื่อมต่อ">🟡</span>
      <span>ห้อง: <strong id="hud-room">-</strong></span>
      <span>👥 <strong id="hud-players">1</strong></span>
      <button class="btn btn-ghost" id="btn-invite">🔗 ชวนแฟน</button>
    </div>

    <div class="pill">
      <button class="btn btn-purple" id="btn-wardrobe">👗 แต่งตัว</button>
      <button class="btn btn-ghost" id="btn-hold-hands" title="เดินตามและจับมือกับแฟนอัตโนมัติ">🤝 จับมือแฟน</button>
      <button class="btn btn-warm" id="btn-lantern">🏮 โคมลอย</button>
      <button class="btn btn-primary" id="btn-krathong">🪷 ลอยกระทง</button>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Bottom HUD -->
  <div class="hud-bottom">
    <div class="chat-panel">
      <div class="chat-messages" id="chat-messages">
        <div style="color:#fbbf24;">✨ แตะบนพื้นหรือกด WASD / ลูกศร เพื่อเดินริมตลิ่ง</div>
      </div>
      <form class="chat-form" id="chat-form">
        <input type="text" id="chat-input" placeholder="พิมพ์ข้อความขึ้นบนหัว..." maxlength="80" autocomplete="off" />
        <button type="submit" class="btn btn-primary">ส่ง</button>
      </form>
    </div>

    <div class="right-controls">
      <div class="emote-bar">
        <button class="emote-btn" data-emote="❤️">❤️</button>
        <button class="emote-btn" data-emote="🥰">🥰</button>
        <button class="emote-btn" data-emote="🙏">🙏</button>
        <button class="emote-btn" data-emote="✨">✨</button>
        <button class="emote-btn" data-emote="🌸">🌸</button>
      </div>
    </div>
  </div>
</div>

<!-- Join / Wardrobe Customization Modal -->
<div class="overlay" id="modal-join">
  <div class="card">
    <h2 id="modal-title">🏮 แต่งตัว & เข้าสู่ริมแม่น้ำ</h2>
    <p class="sub" id="modal-sub">เลือกเพศ ทรงผม สีผม และชุดไทยได้ตามใจชอบ</p>

    <div class="preview-box">
      <canvas id="avatar-preview" width="110" height="110" style="width:110px;height:110px;image-rendering:pixelated;"></canvas>
      <div class="preview-controls">
        <button type="button" class="mini-btn" id="btn-rot-left">↺ หมุนซ้าย</button>
        <button type="button" class="mini-btn" id="btn-rot-right">หมุนขวา ↻</button>
      </div>
    </div>

    <div class="grid-2" id="room-name-row">
      <div class="form-group">
        <label>ชื่อบนหัวตัวละคร</label>
        <input type="text" id="inp-name" placeholder="เช่น น้องบีม, พี่ภัทร..." maxlength="16" />
      </div>
      <div class="form-group">
        <label>รหัสห้อง (ใช้รหัสเดียวกับแฟน)</label>
        <input type="text" id="inp-room" placeholder="เช่น LOVE2026" maxlength="12" />
      </div>
    </div>

    <div class="form-group">
      <label>เลือกเพศตัวละคร</label>
      <div class="gender-row">
        <div class="gender-btn active" data-gender="female">👩 ผู้หญิง</div>
        <div class="gender-btn" data-gender="male">👨 ผู้ชาย</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>เลือกทรงผม & เครื่องหัว</label>
        <select id="inp-hair-style">
          <option value="0">ผมสั้นซอยเท่</option>
          <option value="1" selected>ผมยาวตรงสลวย</option>
          <option value="2">ผมประบ่าปลายงุ้ม</option>
          <option value="3">ผมเกล้ามวยไทย + ปิ่นทอง</option>
          <option value="4">ผมมัดหางม้าสูง</option>
          <option value="5">ผมเปียสองข้างน่ารัก</option>
          <option value="6">ผมแสกกลางสไตล์เกาหลี</option>
          <option value="7">มงกุฎดอกไม้</option>
          <option value="8">หมวกหมาป่าชนเผ่า (เหมือนในรูป)</option>
        </select>
      </div>

      <div class="form-group">
        <label>เลือกชุดไทย & เครื่องแต่งกาย</label>
        <select id="inp-outfit-style">
          <option value="chakkri" selected>ชุดไทยจักรี (สไบเฉียง + ผ้าถุงหน้านาง)</option>
          <option value="siwalai">ชุดไทยศิวาลัย / บรมพิมานแขนยาว</option>
          <option value="raj_pattern">ชุดไทยราชปะแตน + โจงกระเบน</option>
          <option value="lanna">ชุดไทยล้านนา (เสื้อปั๊ด + ผ้าซิ่นตีนจก)</option>
          <option value="boran">ชุดไทยโบราณ (ผ้าแถบ / เสื้อม่อฮ่อม-ผ้าขาวม้า)</option>
          <option value="tribal">ชุดชนเผ่าพื้นเมือง (สไตล์ในรูป)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>สีผิว</label>
      <div class="swatches" id="sw-skin"></div>
    </div>

    <div class="form-group">
      <label>สีผม (เลือกสีสำเร็จหรือแตะวงล้อสี)</label>
      <div class="swatches" id="sw-hair"></div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>สีสไบ / เสื้อท่อนบน</label>
        <div class="swatches" id="sw-outfit"></div>
      </div>
      <div class="form-group">
        <label>สีผ้าถุง / โจงกระเบน</label>
        <div class="swatches" id="sw-bottom"></div>
      </div>
    </div>

    <div style="display:flex; gap:8px; margin-top:6px;">
      <button type="button" class="btn btn-ghost" id="btn-close-wardrobe" style="display:none; flex:1; justify-content:center;">ปิด</button>
      <button type="button" class="btn btn-primary" id="btn-start" style="flex:2; justify-content:center; padding:11px; font-size:15px;">
        เข้าสู่ริมแม่น้ำ ✨
      </button>
    </div>
  </div>
</div>

<!-- Krathong Modal -->
<div class="overlay" id="modal-krathong" style="display:none;">
  <div class="card" style="width:400px;">
    <h2>🪷 ประดิษฐ์กระทงอธิษฐาน</h2>
    <p class="sub">ตัวละครจะเดินลงไปริมตลิ่งและปล่อยกระทงพร้อมกันทั้ง 2 จอ</p>

    <div class="form-group">
      <label>รูปแบบกระทง</label>
      <select id="k-style">
        <option value="lotus">กระทงใบตอง-ดอกบัวเรืองแสง</option>
        <option value="raft">กระทงแพไม้ไผ่ (สไตล์ในรูป)</option>
        <option value="leaf">กระทงใบบัวธรรมชาติ</option>
        <option value="heart">กระทงคู่รูปหัวใจ 💕</option>
      </select>
    </div>

    <div class="form-group">
      <label>สีแสงเทียน</label>
      <select id="k-candle">
        <option value="#fde047">เหลืองทองอบอุ่น</option>
        <option value="#f472b6">ชมพูโรแมนติก</option>
        <option value="#34d399">เขียวมรกต</option>
        <option value="#60a5fa">ฟ้าคราม</option>
      </select>
    </div>

    <div class="form-group">
      <label>คำอธิษฐาน (คลิกที่กระทงในน้ำเพื่ออ่านได้)</label>
      <input type="text" id="k-wish" placeholder="ขอให้เรารักกันนานๆ มีความสุขด้วยกันตลอดไป..." maxlength="100" />
    </div>

    <div style="display:flex; gap:8px; margin-top:14px;">
      <button type="button" class="btn btn-ghost" id="btn-k-cancel" style="flex:1; justify-content:center;">ยกเลิก</button>
      <button type="button" class="btn btn-primary" id="btn-k-launch" style="flex:2; justify-content:center;">🙏 อธิษฐานและลอยกระทง</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('world');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const prevCanvas = document.getElementById('avatar-preview');
  const prevCtx = prevCanvas.getContext('2d');
  prevCtx.imageSmoothingEnabled = false;

  // Read room from URL ?room=XXXX
  const params = new URLSearchParams(window.location.search);
  const initialRoom = (params.get('room') || ('LOVE' + Math.floor(100 + Math.random() * 900))).toUpperCase();
  document.getElementById('inp-room').value = initialRoom;

  // Customization State & Palettes
  const skinColors = ['#ffe5d0', '#ffdbac', '#f1c27d', '#e0ac69', '#c68642', '#8d5524'];
  const hairColors = ['#1c1410', '#4a2c18', '#9a6b32', '#e2b758', '#be123c', '#6d28d9', '#e2e8f0'];
  const outfitColors = ['#f472b6', '#f8fafc', '#fbbf24', '#38bdf8', '#34d399', '#a78bfa', '#e11d48', '#8d5524'];
  const bottomColors = ['#7e22ce', '#be185d', '#1e40af', '#065f46', '#92400e', '#b91c1c', '#334155', '#d97706'];

  let selGender = 'female';
  let selSkin = skinColors[2];
  let selHair = hairColors[0];
  let selOutfit = outfitColors[0];
  let selBottom = bottomColors[0];
  let previewDirIdx = 0;
  const previewDirs = ['down', 'right', 'up', 'left'];
  let hasJoinedRoom = false;

  function setupSwatches(id, list, defaultIdx, onPick, allowCustom = false) {
    const container = document.getElementById(id);
    list.forEach((col, i) => {
      const d = document.createElement('div');
      d.className = 'swatch' + (i === defaultIdx ? ' active' : '');
      d.style.background = col;
      d.onclick = () => {
        container.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        d.classList.add('active');
        onPick(col);
        renderPreview();
      };
      container.appendChild(d);
    });

    if (allowCustom) {
      const wrap = document.createElement('label');
      wrap.className = 'color-picker-wrap';
      wrap.title = 'เลือกสีเองได้อิสระ';
      const inp = document.createElement('input');
      inp.type = 'color';
      inp.value = list[defaultIdx];
      inp.oninput = (e) => {
        container.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        onPick(e.target.value);
        renderPreview();
      };
      wrap.appendChild(inp);
      container.appendChild(wrap);
    }
  }

  function renderPreview() {
    prevCtx.clearRect(0, 0, 110, 110);

  // ==================== GAME STATE ====================
  let peer = null;
  let isHost = false;
  let hostConn = null;
  const guestConns = new Map();

  let selfId = null;
  let roomCode = initialRoom;
  const players = new Map();
  let krathongs = [];
  const lanterns = [];
  const emotes = [];
  const bubbles = new Map();
  let holdingHands = false;

  const keys = {};
  let clickTarget = null;
  let lastNetSync = 0;
  let lastHeartbeat = 0;

  const PEER_OPTS = {
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' }
      ]
    }

  function showToast(html, duration = 4500) {
    const el = document.getElementById('toast');
    el.innerHTML = html;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = 'none'; }, duration);
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }

  function appendChat(sender, text, color = '#34d399') {
    const box = document.getElementById('chat-messages');
    const div = document.createElement('div');
    div.innerHTML = `<strong style="color:${color}">${esc(sender)}:</strong> ${esc(text)}`;
    box.appendChild(div);

  function updateHudCount() {
    document.getElementById('hud-players').textContent = players.size;

  // ==================== P2P NETWORKING (100% GITHUB PAGES) ====================
  function hostBroadcast(msg, exceptId = null) {
    guestConns.forEach((conn, pid) => {
      if (pid !== exceptId && conn.open) {
        conn.send(msg);
      }
    });
  }

  function sendPacket(msg) {
    if (isHost) {
      hostBroadcast(msg);
    } else if (hostConn && hostConn.open) {
      hostConn.send(msg);
    }
  }

  function makePlayerObj(id, name, avatar) {
    const sx = 410 + Math.floor(Math.random() * 140);
    const sy = 268 + Math.floor(Math.random() * 24);
    return {
      id,
      name: (name || 'นักเดินทาง').slice(0, 16),
      avatar,
      x: sx,
      y: sy,
      renderX: sx,
      renderY: sy,
      dir: 'down',
      moving: false,
      kneeling: false
    };
  }

  function joinRoom(rawRoom, rawName, avatar) {
    roomCode = (rawRoom || 'LOVE2026').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'LOVE2026';
    const hostId = 'katong-pakk49-room-' + roomCode;
    document.getElementById('hud-room').textContent = roomCode;

    const btnStart = document.getElementById('btn-start');
    btnStart.disabled = true;
    btnStart.textContent = 'กำลังเข้าสู่ริมแม่น้ำ...';

    peer = new Peer(hostId, PEER_OPTS);

    peer.on('open', (id) => {
      isHost = true;
      selfId = id;
      hasJoinedRoom = true;
      const me = makePlayerObj(selfId, rawName, avatar);
      players.set(selfId, me);
      updateHudCount();

      document.getElementById('status-dot').textContent = '🟢';
      document.getElementById('modal-join').style.display = 'none';
      appendChat('ระบบ', `เปิดห้อง ${roomCode} แล้ว! กดปุ่ม "🔗 ชวนแฟน" ด้านบนส่งให้แฟนได้เลย 💕`, '#fbbf24');

      peer.on('connection', (conn) => {
        conn.on('open', () => {
          guestConns.set(conn.peer, conn);
        });
        conn.on('data', (data) => onHostData(conn, data));
        conn.on('close', () => {
          guestConns.delete(conn.peer);
          const p = players.get(conn.peer);
          if (p) {
            appendChat('ระบบ', `${p.name} ออกจากห้องแล้ว`, '#94a3b8');
            players.delete(conn.peer);
            updateHudCount();
            hostBroadcast({ type: 'left', id: conn.peer });
          }
        });
      });
    });

    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        peer.destroy();
        connectGuest(hostId, rawName, avatar);
      } else {
        btnStart.disabled = false;
        btnStart.textContent = 'เข้าสู่ริมแม่น้ำ ✨';
        showToast('⚠️ เชื่อมต่อไม่สำเร็จ กรุณากดเข้าห้องอีกครั้ง (' + err.type + ')');
      }
    });
  }

  function connectGuest(hostId, rawName, avatar) {
    isHost = false;
    peer = new Peer(PEER_OPTS);

    peer.on('open', (id) => {
      selfId = id;
      const me = makePlayerObj(selfId, rawName, avatar);
      players.set(selfId, me);
      updateHudCount();

      hostConn = peer.connect(hostId, { reliable: true });

      hostConn.on('open', () => {
        hasJoinedRoom = true;
        document.getElementById('status-dot').textContent = '🟢';
        document.getElementById('modal-join').style.display = 'none';
        hostConn.send({ type: 'join', player: me });
        appendChat('ระบบ', `เชื่อมต่อเข้าห้อง ${roomCode} สำเร็จแล้ว 💕`, '#fbbf24');
      });

      hostConn.on('data', (data) => onGuestData(data));

      hostConn.on('close', () => {
        document.getElementById('status-dot').textContent = '🔴';
        appendChat('ระบบ', 'เจ้าของห้องปิดหน้าเว็บไปแล้ว กรุณารีเฟรชเพื่อสร้างห้องใหม่', '#f87171');
      });
    });

    peer.on('error', (err) => {
      const btnStart = document.getElementById('btn-start');
      btnStart.disabled = false;
      btnStart.textContent = 'เข้าสู่ริมแม่น้ำ ✨';
      showToast('⚠️ ไม่พบห้องหรือเน็ตขัดข้อง ลองกดอีกครั้ง (' + err.type + ')');
    });
  }

  function onHostData(conn, msg) {
    if (!msg || !msg.type) return;

    if (msg.type === 'join' && msg.player) {
      const np = msg.player;
      np.id = conn.peer;
      np.renderX = np.x;
      np.renderY = np.y;
      players.set(np.id, np);
      updateHudCount();
      appendChat('ระบบ', `${np.name} เดินทางมาถึงริมแม่น้ำแล้ว 💕`, '#f472b6');

      conn.send({
        type: 'init',
        players: Array.from(players.values()),
        krathongs
      });
      hostBroadcast({ type: 'joined', player: np }, conn.peer);
    } else if (msg.type === 'move') {
      const p = players.get(conn.peer);
      if (p) {
        p.x = msg.x; p.y = msg.y; p.dir = msg.dir; p.moving = msg.moving; p.kneeling = msg.kneeling;
        hostBroadcast({ type: 'move', id: conn.peer, x: p.x, y: p.y, dir: p.dir, moving: p.moving, kneeling: p.kneeling }, conn.peer);
      }
    } else if (msg.type === 'avatar') {
      const p = players.get(conn.peer);
      if (p && msg.avatar) {
        p.avatar = msg.avatar;
        hostBroadcast({ type: 'avatar', id: conn.peer, avatar: p.avatar }, conn.peer);
      }
    } else if (msg.type === 'chat') {
      const p = players.get(conn.peer);
      const name = p ? p.name : 'เพื่อน';
      appendChat(name, msg.text);
      bubbles.set(conn.peer, { text: msg.text, exp: Date.now() + 5500 });
      hostBroadcast({ type: 'chat', id: conn.peer, text: msg.text }, conn.peer);
    } else if (msg.type === 'emote') {
      spawnEmote(conn.peer, msg.emoji);
      hostBroadcast({ type: 'emote', id: conn.peer, emoji: msg.emoji }, conn.peer);
    } else if (msg.type === 'krathong') {
      krathongs.push(msg.krathong);
      if (krathongs.length > 60) krathongs.shift();
      appendChat('🪷', `${msg.krathong.owner} ลอยกระทง: "${msg.krathong.wish}"`, '#fde047');
      hostBroadcast({ type: 'krathong', krathong: msg.krathong }, conn.peer);
    } else if (msg.type === 'lantern') {
      spawnLantern(msg.x, msg.owner);
      hostBroadcast({ type: 'lantern', x: msg.x, owner: msg.owner }, conn.peer);
    }
  }

  function onGuestData(msg) {
    if (!msg || !msg.type) return;

    if (msg.type === 'init') {
      msg.players.forEach(p => {
        if (p.id === selfId) return;
        p.renderX = p.x;
        p.renderY = p.y;
        players.set(p.id, p);
      });
      krathongs = msg.krathongs || [];
      updateHudCount();
    } else if (msg.type === 'joined' && msg.player) {
      if (msg.player.id !== selfId) {
        msg.player.renderX = msg.player.x;
        msg.player.renderY = msg.player.y;
        players.set(msg.player.id, msg.player);
        updateHudCount();
        appendChat('ระบบ', `${msg.player.name} เข้ามาในห้องแล้ว 💕`, '#f472b6');
      }
    } else if (msg.type === 'move') {
      const p = players.get(msg.id);
      if (p && msg.id !== selfId) {
        p.x = msg.x; p.y = msg.y; p.dir = msg.dir; p.moving = msg.moving; p.kneeling = msg.kneeling;
      }
    } else if (msg.type === 'avatar') {
      const p = players.get(msg.id);
      if (p && msg.id !== selfId && msg.avatar) {
        p.avatar = msg.avatar;
      }
    } else if (msg.type === 'sync') {
      msg.players.forEach(sp => {
        if (sp.id === selfId) return;
        let p = players.get(sp.id);
        if (!p) {
          sp.renderX = sp.x; sp.renderY = sp.y;
          players.set(sp.id, sp);
        } else {
          p.x = sp.x; p.y = sp.y; p.dir = sp.dir; p.moving = sp.moving; p.kneeling = sp.kneeling;
          if (sp.avatar) p.avatar = sp.avatar;
        }
      });
      updateHudCount();
    } else if (msg.type === 'chat') {
      const p = players.get(msg.id);
      appendChat(p ? p.name : 'แฟน', msg.text);
      bubbles.set(msg.id, { text: msg.text, exp: Date.now() + 5500 });
    } else if (msg.type === 'emote') {
      spawnEmote(msg.id, msg.emoji);
    } else if (msg.type === 'krathong') {
      krathongs.push(msg.krathong);
      if (krathongs.length > 60) krathongs.shift();
      appendChat('🪷', `${msg.krathong.owner} ลอยกระทง: "${msg.krathong.wish}"`, '#fde047');
    } else if (msg.type === 'lantern') {
      spawnLantern(msg.x, msg.owner);
    } else if (msg.type === 'left') {
      const p = players.get(msg.id);
      if (p) appendChat('ระบบ', `${p.name} ออกจากห้องแล้ว`, '#94a3b8');
      players.delete(msg.id);
      updateHudCount();
    }
  }

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const cy = (e.clientY - rect.top) * (canvas.height / rect.height);

    for (let i = krathongs.length - 1; i >= 0; i--) {
      const k = krathongs[i];
      if (Math.hypot(cx - k.x, cy - k.y) < 26) {
        showToast(`🪷 กระทงของ <strong>${esc(k.owner)}</strong><br>"${esc(k.wish)}"`, 5000);

      holdingHands = false;
      document.getElementById('btn-hold-hands').classList.remove('active');
    }
    const targetX = Math.max(125, Math.min(915, cx));
    const targetY = cy > 316 ? 314 : Math.max(150, cy);
    clickTarget = { x: targetX, y: targetY };
  });

  // ==================== PIXEL ART RENDERER ====================
  function drawScene(t) {
    // 1. Forest grass
    ctx.fillStyle = '#264e27';
    ctx.fillRect(0, 0, 960, 290);

    ctx.fillStyle = '#1d3e1e';
    for (let gx = 130; gx < 950; gx += 48) {
      for (let gy = 25; gy < 255; gy += 44) {
        ctx.fillRect(gx, gy, 6, 3);
        ctx.fillRect(gx + 3, gy - 3, 3, 3);
      }
    }

    // 2. Cliff & waterfall
    ctx.fillStyle = '#232b32';
    ctx.fillRect(0, 0, 250, 255);
    ctx.fillStyle = '#36414b';
    ctx.fillRect(130, 30, 125, 225);
    ctx.fillStyle = '#4b5866';
    ctx.fillRect(145, 50, 95, 185);
    ctx.fillStyle = '#7dd3fc';
    ctx.fillRect(172, 74, 4, 4);
    ctx.fillRect(205, 118, 4, 4);

    ctx.fillStyle = '#1e6091';
    ctx.fillRect(0, 0, 124, 316);
    ctx.fillStyle = '#38bdf8';
    const wfShift = Math.floor(t / 55) % 24;
    for (let wy = wfShift - 24; wy < 312; wy += 24) {
      ctx.fillRect(16, wy, 18, 15);
      ctx.fillRect(52, wy + 8, 24, 15);
      ctx.fillRect(92, wy + 3, 16, 15);
    }
    ctx.fillStyle = '#e0f2fe';
    ctx.fillRect(6, 304 + Math.sin(t / 140) * 2, 114, 9);

    // 3. Sacred Stone Altar
    ctx.fillStyle = '#5e3a20';
    ctx.beginPath();
    ctx.ellipse(540, 128, 145, 72, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#7c4d2b';
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.fillStyle = '#3e2412';
    ctx.fillRect(575, 120, 42, 4);
    ctx.fillRect(594, 106, 4, 32);

    ctx.fillStyle = '#8c7a6b';
    ctx.fillRect(514, 52, 52, 68);
    ctx.fillStyle = '#a89686';
    ctx.fillRect(522, 38, 36, 22);
    ctx.fillStyle = '#facc15';
    ctx.fillRect(516, 68, 48, 5);

    ctx.fillStyle = '#9a3412';
    ctx.fillRect(476, 92, 24, 24);
    ctx.fillRect(580, 92, 24, 24);
    ctx.fillStyle = '#facc15';
    ctx.fillRect(478, 82, 20, 10);
    ctx.fillStyle = '#f43f5e';
    ctx.fillRect(582, 82, 20, 10);

    [[498, 106], [572, 106]].forEach(([cx, cy], idx) => {
      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(cx, cy, 8, 14);
      ctx.fillStyle = '#fb923c';
      ctx.fillRect(cx + 2, cy - 5 + Math.sin(t / 90 + idx), 4, 5);
    });

    ctx.fillStyle = '#78350f';
    ctx.fillRect(508, 134, 64, 12);

    // 4. Cobblestone Shoreline
    ctx.fillStyle = '#968c7e';
    ctx.fillRect(114, 264, 846, 50);
    ctx.fillStyle = '#b5ab9c';
    for (let px = 122; px < 950; px += 28) {
      for (let py = 269; py < 307; py += 16) {
        ctx.fillRect(px + (py % 32 === 0 ? 10 : 0), py, 19, 10);
      }
    }
    ctx.fillStyle = '#e7d2b8';
    ctx.fillRect(114, 311, 846, 8);

    // 5. River Water
    const grad = ctx.createLinearGradient(0, 319, 0, 540);
    grad.addColorStop(0, '#1f7a74');
    grad.addColorStop(0.28, '#135263');
    grad.addColorStop(1, '#062029');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 319, 960, 221);

    ctx.fillStyle = 'rgba(167, 243, 208, 0.22)';
    const ripple = Math.sin(t / 380) * 6;
    for (let rx = 124; rx < 945; rx += 32) {
      ctx.fillRect(rx + ripple, 327, 18, 5);
      ctx.fillRect(rx - ripple + 8, 344, 16, 4);
      ctx.fillRect(rx + ripple * 0.6, 362, 14, 4);

    // 6. Torches
    const torches = [
      [270, 214], [575, 214], [810, 214],
      [230, 318], [625, 322]
    ];
    torches.forEach(([tx, ty], i) => {
      ctx.fillStyle = '#451a03';
      ctx.fillRect(tx - 3, ty, 6, 46);
      const glow = ctx.createRadialGradient(tx, ty - 4, 2, tx, ty - 4, 38);
      glow.addColorStop(0, 'rgba(251, 191, 36, 0.75)');
      glow.addColorStop(1, 'rgba(251, 191, 36, 0)');

      ctx.arc(tx, ty - 4, 38, 0, Math.PI * 2);

      const fl = Math.sin(t / 85 + i) * 2;
      ctx.fillStyle = '#f97316';
      ctx.fillRect(tx - 4, ty - 10 + fl, 8, 10);
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(tx - 2, ty - 7 + fl, 4, 6);
    });
  }

  function drawKrathong(k, t) {
    const bob = Math.sin((t + k.seed) / 340) * 2;
    const x = k.x;
    const y = k.y + bob;

    const aura = ctx.createRadialGradient(x, y, 2, x, y, 28);
    aura.addColorStop(0, 'rgba(110, 231, 183, 0.58)');
    aura.addColorStop(0.5, 'rgba(253, 224, 71, 0.25)');
    aura.addColorStop(1, 'rgba(110, 231, 183, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(x, y, 28, 0, Math.PI * 2);
    ctx.fill();

    if (k.style === 'raft') {
      ctx.fillStyle = '#854d0e';
      ctx.fillRect(x - 13, y - 3, 26, 8);
      ctx.fillStyle = '#ca8a04';
      ctx.fillRect(x - 11, y - 5, 22, 4);
    } else if (k.style === 'leaf') {
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.ellipse(x, y, 13, 6, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (k.style === 'heart') {
      ctx.fillStyle = '#fb7185';
      ctx.beginPath();
      ctx.arc(x - 5, y - 2, 6, 0, Math.PI * 2);
      ctx.arc(x + 5, y - 2, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(x - 8, y, 16, 5);
    } else {
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(x - 12, y - 2, 24, 6);
      ctx.fillStyle = '#f472b6';
      ctx.fillRect(x - 9, y - 6, 18, 5);
      ctx.fillStyle = '#fbcfe8';
      ctx.fillRect(x - 5, y - 8, 10, 3);
    }

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x - 1.5, y - 12, 3, 7);
    const fl = Math.sin(t / 75 + k.seed) * 1.5;
    ctx.fillStyle = k.candleColor || '#fde047';
    ctx.fillRect(x - 2.5, y - 17 + fl, 5, 5);
  }

  // ==================== DETAILED THAI OUTFIT & CHARACTER RENDERER ====================
  function drawCharacter(c, p, t, isPreview = false) {
    const x = Math.round(p.renderX);
    const y = Math.round(p.renderY);
    const walkBob = p.moving ? Math.abs(Math.sin(t / 105)) * 3 : 0;
    const squat = p.kneeling ? 6 : 0;

    // Ground shadow
    c.fillStyle = 'rgba(0, 0, 0, 0.38)';
    c.beginPath();
    c.ellipse(x, y + 2, 12, 5, 0, 0, Math.PI * 2);
    c.fill();

    const by = y - walkBob + squat;
    const av = p.avatar || {};
    const gender = av.gender || 'female';
    const outfit = av.outfitStyle || 'chakkri';
    const topCol = av.outfitColor || '#f472b6';
    const botCol = av.bottomColor || '#7e22ce';
    const skin = av.skin || '#f1c27d';

    // 1. Feet / Legs (visible below Chong Kraben or ankles)
    c.fillStyle = skin;
    c.fillRect(x - 6, by - 6, 4, 6 - squat / 2);
    c.fillRect(x + 2, by - 6, 4, 6 - squat / 2);

    // 2. Arms (skin base)
    c.fillStyle = skin;
    c.fillRect(x - 11, by - 23, 3, 11);
    c.fillRect(x + 8, by - 23, 3, 11);

    // 3. Outfits (Thai Traditional Costumes!)
    if (outfit === 'chakkri') {
      // ชุดไทยจักรี: สไบเฉียงเปิดไหล่ขวา + เข็มขัดทอง + ผ้าถุงหน้านางยาว
      c.fillStyle = skin;
      c.fillRect(x - 8, by - 24, 16, 10); // bare upper torso/shoulder

      // Sbai diagonal sash across chest
      c.fillStyle = topCol;
      c.fillRect(x - 8, by - 24, 6, 11);
      c.fillRect(x - 5, by - 21, 9, 8);
      c.fillRect(x + 2, by - 17, 6, 5);
      // Gold Sbai trim
      c.fillStyle = '#fde047';
      c.fillRect(x - 2, by - 24, 2, 11);

      // Long Pha Sin skirt
      c.fillStyle = botCol;
      c.fillRect(x - 8, by - 14, 16, 13 - squat / 2);
      // Gold pleated front panel (หน้านาง)
      c.fillStyle = '#facc15';
      c.fillRect(x - 2, by - 14, 4, 13 - squat / 2);
      // Gold Thai belt (เข็มขัดทอง)
      c.fillStyle = '#fde047';
      c.fillRect(x - 8, by - 15, 16, 2);

    } else if (outfit === 'siwalai') {
      // ชุดไทยศิวาลัย / บรมพิมาน: เสื้อแขนยาวพอดีตัว + สไบทับ + ผ้าถุงยกทอง
      c.fillStyle = topCol;
      c.fillRect(x - 8, by - 24, 16, 11);
      // Long sleeves
      c.fillRect(x - 11, by - 24, 3, 10);
      c.fillRect(x + 8, by - 24, 3, 10);
      // Gold collar & cuffs
      c.fillStyle = '#fde047';
      c.fillRect(x - 4, by - 24, 8, 2);
      c.fillRect(x - 11, by - 16, 3, 2);
      c.fillRect(x + 8, by - 16, 3, 2);

      // Long silk skirt with gold hem
      c.fillStyle = botCol;
      c.fillRect(x - 8, by - 13, 16, 12 - squat / 2);
      c.fillStyle = '#facc15';
      c.fillRect(x - 8, by - 14, 16, 2); // belt
      c.fillRect(x - 8, by - 4 - squat / 2, 16, 2); // gold hem

    } else if (outfit === 'raj_pattern') {
      // ชุดไทยราชปะแตน + โจงกระเบน
      c.fillStyle = topCol;
      c.fillRect(x - 8, by - 24, 16, 12);
      // Long sleeves
      c.fillRect(x - 11, by - 24, 3, 10);
      c.fillRect(x + 8, by - 24, 3, 10);
      // Standing collar & 5 gold buttons
      c.fillStyle = '#eab308';
      c.fillRect(x - 3, by - 25, 6, 2);
      c.fillRect(x - 1, by - 22, 2, 2);
      c.fillRect(x - 1, by - 19, 2, 2);
      c.fillRect(x - 1, by - 16, 2, 2);

      // Silk waist sash
      c.fillStyle = botCol;
      c.fillRect(x - 8, by - 13, 16, 2);
      // Puffy Chong Kraben (โจงกระเบน)
      c.fillRect(x - 9, by - 11, 8, 6);
      c.fillRect(x + 1, by - 11, 8, 6);

    } else if (outfit === 'lanna') {
      // ชุดไทยล้านนา: เสื้อปั๊ดป้ายข้าง + ผ้าซิ่นตีนจกมีลายเชิง
      c.fillStyle = topCol;
      c.fillRect(x - 8, by - 24, 16, 11);
      c.fillRect(x - 11, by - 24, 3, 9);
      c.fillRect(x + 8, by - 24, 3, 9);
      // Diagonal Lanna lapel trim
      c.fillStyle = '#fde047';
      c.fillRect(x - 3, by - 24, 2, 6);
      c.fillRect(x - 1, by - 19, 5, 2);

      // Northern Pha Sin skirt with woven stripes
      c.fillStyle = botCol;
      c.fillRect(x - 8, by - 13, 16, 12 - squat / 2);
      c.fillStyle = '#f43f5e';
      c.fillRect(x - 8, by - 6 - squat / 2, 16, 2);
      c.fillStyle = '#fde047';
      c.fillRect(x - 8, by - 4 - squat / 2, 16, 2);

    } else if (outfit === 'boran') {
      // ชุดไทยชาวบ้านโบราณ (หญิง: ผ้าแถบ+โจงกระเบน / ชาย: เสื้อม่อฮ่อม+ผ้าขาวม้า+โจงกระเบน)
      if (gender === 'female') {
        c.fillStyle = skin;
        c.fillRect(x - 8, by - 24, 16, 12);
        // Chest wrap cloth (ผ้าแถบ)
        c.fillStyle = topCol;
        c.fillRect(x - 8, by - 21, 16, 6);
      } else {
        c.fillStyle = topCol;
        c.fillRect(x - 8, by - 24, 16, 12);
        c.fillRect(x - 11, by - 24, 3, 7);
        c.fillRect(x + 8, by - 24, 3, 7);
        // Pha Khao Ma sash (ผ้าขาวม้าพาดบ่า)
        c.fillStyle = '#ef4444';
        c.fillRect(x - 7, by - 24, 4, 12);
        c.fillStyle = '#fde047';
        c.fillRect(x - 6, by - 22, 2, 2);
        c.fillRect(x - 6, by - 18, 2, 2);
      }
      // Chong Kraben
      c.fillStyle = botCol;
      c.fillRect(x - 9, by - 12, 8, 7);
      c.fillRect(x + 1, by - 12, 8, 7);
      c.fillRect(x - 3, by - 12, 6, 8);

    } else {
      // Tribal outfit (ชุดชนเผ่าพื้นเมืองสไตล์ในรูป)
      c.fillStyle = topCol;
      c.fillRect(x - 8, by - 24, 16, 15);
      // Shell/bone necklace
      c.fillStyle = '#fef3c7';
      c.fillRect(x - 4, by - 23, 8, 2);
      // Fur hem
      c.fillStyle = botCol;
      c.fillRect(x - 8, by - 11, 16, 5);
    }

    // 4. Head
    c.fillStyle = skin;
    c.fillRect(x - 8, by - 38, 16, 14);

    // 5. Face Features (Gender-aware eyes, brows, blush)
    if (p.dir !== 'up') {
      const eo = p.dir === 'left' ? -2 : p.dir === 'right' ? 2 : 0;

      // Eyebrows
      c.fillStyle = av.hairColor || '#1c1410';
      if (gender === 'male') {
        c.fillRect(x - 5 + eo, by - 33, 4, 1);
        c.fillRect(x + 1 + eo, by - 33, 4, 1);
      } else {
        c.fillRect(x - 4 + eo, by - 33, 3, 1);
        c.fillRect(x + 1 + eo, by - 33, 3, 1);
      }

      // Eyes
      c.fillStyle = '#1e293b';
      c.fillRect(x - 4 + eo, by - 31, 2, 3);
      c.fillRect(x + 2 + eo, by - 31, 2, 3);

      // Female eyelashes & rosy blush
      if (gender === 'female') {
        c.fillRect(x - 5 + eo, by - 31, 1, 1);
        c.fillRect(x + 4 + eo, by - 31, 1, 1);
        c.fillStyle = 'rgba(244, 63, 94, 0.42)';
        c.fillRect(x - 6 + eo, by - 28, 2, 2);
        c.fillRect(x + 4 + eo, by - 28, 2, 2);
      }
    }

    // 6. Hairstyles & Headpieces (9 styles!)
    const hs = Number(av.hairStyle || 0);
    c.fillStyle = av.hairColor || '#1c1410';

    if (hs === 8) {
      // หมวกหมาป่าชนเผ่า (Tribal wolf hood)
      c.fillStyle = '#94a3b8';
      c.fillRect(x - 10, by - 43, 20, 8);
      c.fillRect(x - 10, by - 47, 4, 4);
      c.fillRect(x + 6, by - 47, 4, 4);
      c.fillStyle = '#cbd5e1';
      c.fillRect(x - 10, by - 35, 3, 11);
      c.fillRect(x + 7, by - 35, 3, 11);
    } else {
      // Base hair cap
      c.fillRect(x - 9, by - 41, 18, 6);
      if (p.dir === 'up') {
        c.fillRect(x - 9, by - 36, 18, 10);
      }

      if (hs === 0) {
        // ผมสั้นซอยเท่
        c.fillRect(x - 9, by - 36, 2, 5);
        c.fillRect(x + 7, by - 36, 2, 5);
      } else if (hs === 1) {
        // ผมยาวตรงสลวย
        c.fillRect(x - 10, by - 36, 3, 18);
        c.fillRect(x + 7, by - 36, 3, 18);
      } else if (hs === 2) {
        // ผมประบ่าปลายงุ้ม
        c.fillRect(x - 10, by - 36, 3, 11);
        c.fillRect(x + 7, by - 36, 3, 11);
      } else if (hs === 3) {
        // ผมเกล้ามวยไทย + ปิ่นทอง
        c.fillRect(x - 4, by - 46, 8, 5);
        c.fillStyle = '#fde047';
        c.fillRect(x - 5, by - 42, 10, 2); // gold coronet band
        c.fillRect(x + 4, by - 46, 4, 2);  // gold hairpin
      } else if (hs === 4) {
        // ผมมัดหางม้าสูง
        c.fillRect(x - 3, by - 45, 6, 4);
        c.fillRect(x + 3, by - 44, 5, 11);
      } else if (hs === 5) {
        // ผมเปียสองข้างน่ารัก
        c.fillRect(x - 11, by - 35, 3, 15);
        c.fillRect(x + 8, by - 35, 3, 15);
        c.fillStyle = '#f43f5e';
        c.fillRect(x - 11, by - 23, 3, 2);
        c.fillRect(x + 8, by - 23, 3, 2);
      } else if (hs === 6) {
        // ผมแสกกลางสไตล์เกาหลี
        c.fillRect(x - 10, by - 37, 3, 9);
        c.fillRect(x + 7, by - 37, 3, 9);
        c.fillStyle = skin;
        c.fillRect(x - 1, by - 37, 2, 2); // center part gap
      } else if (hs === 7) {
        // มงกุฎดอกไม้ + ผมประบ่า
        c.fillRect(x - 10, by - 36, 3, 12);
        c.fillRect(x + 7, by - 36, 3, 12);
        c.fillStyle = '#f43f5e';
        c.fillRect(x - 8, by - 42, 4, 3);
        c.fillStyle = '#facc15';
        c.fillRect(x - 2, by - 42, 4, 3);
        c.fillStyle = '#38bdf8';
        c.fillRect(x + 4, by - 42, 4, 3);
      }
    }

    if (isPreview) return;

    // 7. Roblox-style Nameplate
    c.font = 'bold 11px Prompt, sans-serif';
    c.textAlign = 'center';
    const nw = c.measureText(p.name).width + 10;
    c.fillStyle = 'rgba(13, 21, 32, 0.78)';
    c.fillRect(x - nw / 2, by - 60, nw, 15);
    c.fillStyle = p.id === selfId ? '#fde047' : '#ffffff';
    c.fillText(p.name, x, by - 49);

    // 8. Roblox-style Overhead Chat Bubble
    const b = bubbles.get(p.id);
    if (b && b.exp > Date.now()) {
      c.font = '12px Prompt, sans-serif';
      const bw = Math.min(210, c.measureText(b.text).width + 18);
      const bx = x - bw / 2;
      const byBubble = by - 86;
      c.fillStyle = '#ffffff';
      c.beginPath();
      c.roundRect(bx, byBubble, bw, 22, 8);
      c.fill();
      c.fillStyle = '#0f172a';
      c.fillText(b.text, x, byBubble + 15, 196);
    }
  }

  function drawLantern(l, t) {
    const sway = Math.sin((t + l.seed) / 400) * 4;
    const x = l.x + sway;
    const y = l.y;

    const glow = ctx.createRadialGradient(x, y, 2, x, y, 24);
    glow.addColorStop(0, 'rgba(251, 146, 60, 0.75)');
    glow.addColorStop(1, 'rgba(251, 146, 60, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, 24, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fb923c';
    ctx.fillRect(x - 6, y - 9, 12, 16);
    ctx.fillStyle = '#fef08a';
    ctx.fillRect(x - 3, y - 5, 6, 9);
  }

  // ==================== MAIN LOOP ====================
  let prevTime = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - prevTime) / 1000);
    prevTime = now;

    const me = players.get(selfId);
    if (me && !me.kneeling) {
      let vx = 0, vy = 0;

      if (holdingHands && players.size > 1) {
        let partner = null;
        for (const [id, pl] of players.entries()) {
          if (id !== selfId) { partner = pl; break; }
        }
        if (partner) {
          const destX = Math.max(125, Math.min(915, partner.x + 24));
          const destY = partner.y;
          const d = Math.hypot(destX - me.x, destY - me.y);
          if (d > 4) {
            vx = (destX - me.x) / d;
            vy = (destY - me.y) / d;
            me.x += vx * 145 * dt;
            me.y += vy * 145 * dt;
            me.moving = true;
            me.dir = Math.abs(vx) > Math.abs(vy) ? (vx > 0 ? 'right' : 'left') : (vy > 0 ? 'down' : 'up');
          } else {
            me.moving = false;
            me.dir = partner.dir;
          }
        }
      } else {
        if (keys['w'] || keys['arrowup']) vy -= 1;
        if (keys['s'] || keys['arrowdown']) vy += 1;
        if (keys['a'] || keys['arrowleft']) vx -= 1;
        if (keys['d'] || keys['arrowright']) vx += 1;

        if (vx !== 0 || vy !== 0) {
          const len = Math.hypot(vx, vy);
          vx /= len; vy /= len;
          me.x = Math.max(125, Math.min(915, me.x + vx * 140 * dt));
          me.y = Math.max(150, Math.min(314, me.y + vy * 140 * dt));
          me.moving = true;
          me.dir = Math.abs(vx) > Math.abs(vy) ? (vx > 0 ? 'right' : 'left') : (vy > 0 ? 'down' : 'up');
        } else if (clickTarget) {
          const d = Math.hypot(clickTarget.x - me.x, clickTarget.y - me.y);
          if (d > 4) {
            const dx = (clickTarget.x - me.x) / d;
            const dy = (clickTarget.y - me.y) / d;
            me.x += dx * 140 * dt;
            me.y += dy * 140 * dt;
            me.moving = true;
            me.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
          } else {
            clickTarget = null;
            me.moving = false;
          }
        } else {
          me.moving = false;
        }
      }

      if (now - lastNetSync > 50) {
        lastNetSync = now;
        sendPacket({
          type: 'move',
          x: me.x,
          y: me.y,
          dir: me.dir,
          moving: me.moving,
          kneeling: me.kneeling
        });
      }
    }

    if (isHost && now - lastHeartbeat > 1200) {
      lastHeartbeat = now;
      hostBroadcast({
        type: 'sync',
        players: Array.from(players.values())
      });
    }

    players.forEach(p => {
      p.renderX += (p.x - p.renderX) * 0.25;
      p.renderY += (p.y - p.renderY) * 0.25;
    });

    for (let i = krathongs.length - 1; i >= 0; i--) {
      const k = krathongs[i];
      k.x += k.vx * 18 * dt;
      k.y += k.vy * 10 * dt;
      if (k.x > 1020 || k.y > 600) {
        krathongs.splice(i, 1);
      }
    }

    for (let i = lanterns.length - 1; i >= 0; i--) {
      const l = lanterns[i];
      l.x += l.vx * 20 * dt;
      l.y += l.vy * 28 * dt;
      if (l.y < -40) lanterns.splice(i, 1);
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawScene(now);

    if (clickTarget) {
      ctx.strokeStyle = 'rgba(253, 224, 71, 0.75)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(clickTarget.x, clickTarget.y, 8 + Math.sin(now / 150) * 2, 4, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    krathongs.forEach(k => drawKrathong(k, now));

    const sorted = Array.from(players.values()).sort((a, b) => a.renderY - b.renderY);
    sorted.forEach(p => drawCharacter(ctx, p, now));

    if (holdingHands && sorted.length >= 2) {
      const p1 = sorted[0];
      const p2 = sorted[1];
      if (Math.hypot(p1.renderX - p2.renderX, p1.renderY - p2.renderY) < 42) {
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('💕', (p1.renderX + p2.renderX) / 2, Math.min(p1.renderY, p2.renderY) - 24 + Math.sin(now / 200) * 2);
      }
    }

    lanterns.forEach(l => drawLantern(l, now));

    for (let i = emotes.length - 1; i >= 0; i--) {
      const em = emotes[i];
      em.y -= 36 * dt;
      em.life -= 0.75 * dt;
      if (em.life <= 0) {
        emotes.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, em.life);
      ctx.font = '22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(em.emoji, em.x, em.y);
      ctx.restore();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
