<style>

<div id="lobby"><div class="panel">

 <div><label>เทียน</label><select id="kcd"><option value="0">เทียนทอง</option><option value="1">เทียนขาว</option><option value="2">เทียนแดง</option></select></div></div>
 <div class="row"><div><label>ธูป</label><select id="ki"><option value="1">มี</option><option value="0">ไม่มี</option></select></div>

<script>
// DEMO ONLY: fake local socket + simulated partner so the game can be previewed without a server
const LS={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(){},r(){}};
function io(){const H={},S={};let room=null;const on=(e,f)=>{(H[e]=H[e]||[]).push(f)},em=(e,d)=>setTimeout(()=>(H[e]||[]).forEach(f=>f(d)),0);
 const bc=()=>em('room',JSON.parse(JSON.stringify(room)));
 const P2={id:2,name:'Demo Partner 💕',avatar:{gender:'female',hairColor:'#7a3a8a',hairStyle:'long',shirt:'#3a8ae0'},x:280,y:240,dir:'down',connected:true,kr:{type:5,color:'#ff7eb6',flower:0,candle:1,incense:true,deco:2},pressed:false};
 let tx=280,ty=240,me;
 setInterval(()=>{if(!room||room.players.length<2)return;const p=room.players[1];const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);if(d>3){const sp=Math.min(d,5);p.x+=dx/d*sp;p.y+=dy/d*sp;p.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');em('p',{id:2,x:p.x,y:p.y,dir:p.dir,moving:true})}else em('p',{id:2,x:p.x,y:p.y,dir:p.dir,moving:false})},50);
 const start=(d,cb)=>{room={code:'123456',floated:false,players:[{id:1,name:d.name,avatar:d.avatar,x:220,y:240,dir:'down',connected:true,kr:null,pressed:false}]};cb&&cb({ok:true});em('joined',{code:'123456',token:'demo',id:1});bc();setTimeout(()=>{room.players.push(P2);bc()},1800)};
 const sock={on,emit(e,d,cb){
  if(e==='create'||e==='join')start(d,cb);
  else if(e==='move'){const p=room.players[0];p.x=d.x;p.y=d.y;tx=d.x+(d.dir==='left'?50:-50);ty=d.y+8}
  else if(e==='krathong'){room.players[0].kr=d;bc()}
  else if(e==='chat'){em('chat',{id:1,name:room.players[0].name,text:d});setTimeout(()=>em('chat',{id:2,name:P2.name,text:'ชอบที่นี่จังเลย ❤️'}),1200)}
  else if(e==='emote'){em('emote',{id:1,e:d});setTimeout(()=>em('emote',{id:2,e:d}),500)}
  else if(e==='float:press'){room.players[0].pressed=true;bc();setTimeout(()=>{P2.pressed=true;bc();const now=Date.now();em('float:start',{now,startAt:now+3000});setTimeout(()=>{room.floated=true;room.players.forEach(p=>p.pressed=false);bc()},3500)},900)}
  else if(e==='float:cancel'){room.players[0].pressed=false;bc()}
 }};setTimeout(()=>em('connect'),0);return sock}
</script>
<div style="position:fixed;z-index:99;bottom:4px;right:6px;font-size:11px;background:#000a;color:#ffd86b;padding:2px 8px;border-radius:6px;pointer-events:none">DEMO · คู่หูจำลอง (เวอร์ชันจริงเป็น multiplayer)</div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const W=1600,H=1200,SPEED=150,PIER={x1:600,x2:900,y1:880};
const FLOWER=['#ff7eb6','#ffd23f','#ffffff','#b07cff'],CANDLE=['#ffd86b','#f4f0e0','#e03a3a'];
// ---------- avatar / krathong pixel drawing (shared by preview & game) ----------
function drawChar(ctx,av,dir,f){
  const sk='#f2c9a0';ctx.clearRect(0,0,16,24);const R=(c,x,y,w,h)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
  const step=f?1:0;
  R('#2a2a40',5,17+(step?0:0),3,6-(step?1:0));R('#2a2a40',8,17,3,6-(step?0:1)); // legs
  R(av.shirt,4,10,8,8);R(av.shirt,3,11,1,5);R(av.shirt,12,11,1,5);R(sk,3,16,1,1);R(sk,12,16,1,1);
  if(av.gender==='female'){R(av.shirt,4,16,8,3)} // skirt/top
  R(sk,4,3,8,8);
  if(dir==='up'){R(av.hairColor,4,2,8,8)}else{R(av.hairColor,4,2,8,3);R(av.hairColor,4,3,1,3);R(av.hairColor,11,3,1,3);
    if(dir==='down'){R('#222',6,7,1,2);R('#222',9,7,1,2)}else if(dir==='left'){R('#222',5,7,1,2)}else{R('#222',10,7,1,2)}}
  if(av.hairStyle==='long'){R(av.hairColor,3,3,1,10);R(av.hairColor,12,3,1,10);if(dir==='up')R(av.hairColor,3,9,10,5)}
}
function drawKr(ctx,k,s=1){ // draws in 48x48 box
  const R=(c,x,y,w,h)=>{ctx.fillStyle=c;ctx.fillRect(x*s,y*s,w*s,h*s)},fl=FLOWER[k.flower],base=k.color;
  const t=k.type;
  if(t===0){R('#2e8b3a',8,28,32,8);R('#43b04f',10,26,28,4);R('#1f6b2a',12,36,24,3)}                     // banana leaf
  else if(t===1){for(let i=0;i<5;i++){R(i%2?'#ff9ed0':'#ffb8de',8+i*7,26+(i%2)*2,8,10)};R(base,14,34,20,4)} // lotus
  else if(t===2){R('#2e8b3a',8,32,32,6);for(let i=0;i<4;i++)R('#d62a4b',10+i*8,26+(i%2)*2,8,8)}       // rose
  else if(t===3){R('#2e8b3a',8,32,32,6);for(let i=0;i<5;i++)R('#ffb300',8+i*7,27+(i%2)*2,7,7)}        // marigold
  else if(t===4){R(base,12,26,10,6);R(base,26,26,10,6);R(base,10,30,28,4);R(base,14,34,20,3);R(base,20,37,8,2)} // heart
  else if(t===5){R(base,6,30,16,8);R(base,26,30,16,8);R('#ff7eb6',22,28,4,4);R('#fff',8,28,12,3);R('#fff',28,28,12,3)}
  else{R('#6a3fd0',8,30,32,7);R('#9ae6ff',12,26,6,6);R('#ff9ae6',30,24,6,8);R('#fff',22,22,4,4)}
  R(fl,18,28,4,4);R(fl,26,29,4,4);
  if(k.deco===1)R('#fff7a0',10,24,3,3);if(k.deco===2)R('#ff4f7a',34,24,4,4);if(k.deco===3)R('#5ccf6a',8,30,4,4);
  if(k.incense){R('#8a5a2b',31,12,2,16);R('#ff5030',31,10,2,2)}
  R(CANDLE[k.candle],22,16,4,12);R('#ffd24a',22,12,4,4);R('#fff7c0',23,13,2,2);
}
// ---------- lobby avatar preview ----------
const getAv=()=>({gender:$('#gen').value,hairColor:$('#hc').value,hairStyle:$('#hs').value,shirt:$('#sh').value});
const upPrev=()=>drawChar($('#avprev').getContext('2d'),getAv(),'down',0);
['gen','hc','hs','sh'].forEach(i=>$('#'+i).oninput=upPrev);upPrev();
// ---------- network ----------
const socket=io({reconnection:true});
let me=null,room=null,krMine=null,scene=null,session=JSON.parse(LS.g('tlk')||'null');
const err=m=>{$('#err').textContent=m||''};
function busy(b){['create','join'].forEach(i=>$('#'+i).disabled=b)}
function req(ev,data){
  const n=$('#nm').value.trim();if(!n)return err('กรุณาตั้งชื่อตัวละคร');err('');busy(true);
  const t=setTimeout(()=>{busy(false);err('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้')},8000);
  socket.emit(ev,{name:n,avatar:getAv(),...data},r=>{clearTimeout(t);busy(false);if(r?.error)err(r.error)});
}
$('#create').onclick=()=>req('create');
$('#join').onclick=()=>{const c=$('#jc').value.trim();if(!/^\d{6}$/.test(c))return err('กรอกรหัส 6 หลัก');req('join',{code:c})};
socket.on('joined',d=>{me=d.id;session={code:d.code,token:d.token};$('#code').textContent=d.code});
socket.on('connect',()=>{setStatus(true);if(session&&me!==null)socket.emit('rejoin',session,r=>{if(r?.error){location.reload()}})});
socket.on('disconnect',()=>setStatus(false,'Reconnecting…'));
function setStatus(ok,t){$('#status').textContent=ok?'🟢 Connected':'🔴 '+(t||'Disconnected')}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2500)}
socket.on('toast',toast);
socket.on('room',r=>{
  room=r;const other=r.players.find(p=>p.id!==me);
  if(r.players.length<2){$('#lobby .panel:first-child').style.display='none';$('#wait').style.display='block';return}
  if(!scene)startGame();
  scene?.sync&&scene.sync();
  setStatus(true);
  if(other&&!other.connected)$('#status').textContent='🟠 Partner Reconnecting…';
});
// ---------- chat ----------
function log(t){const l=$('#log');l.innerHTML+=`<div>${t}</div>`;while(l.children.length>6)l.firstChild.remove()}
socket.on('chat',m=>{log(`<b>${esc(m.name)}</b>: ${esc(m.text)}`);scene?.bubble(m.id,m.text)});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#chatin').addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'&&e.target.value.trim()){socket.emit('chat',e.target.value);e.target.value='';e.target.blur()}});
document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>socket.emit('emote',b.dataset.e));
// ---------- audio (WebAudio synth, no files) ----------
let AC,master,musicOn=true;
function audio(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
  const notes=[262,294,330,392,440,392,330,294];let i=0;
  setInterval(()=>{if(!musicOn)return;tone(notes[i++%8]*(Math.random()<.2?2:1),1.4,.05,'sine');if(Math.random()<.35)cricket()},700);
  const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=nb.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=Math.random()*2-1;
  const ns=AC.createBufferSource();ns.buffer=nb;ns.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;const g=AC.createGain();g.gain.value=.05;ns.connect(f).connect(g).connect(master);ns.start()} // water
function tone(fr,dur,v,type='sine'){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=fr;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);o.connect(g).connect(master);o.start();o.stop(AC.currentTime+dur)}
const cricket=()=>[0,.08,.16].forEach(t=>setTimeout(()=>tone(4200,.04,.012,'square'),t*1000));
const bell=()=>[880,1320,1760].forEach((f,i)=>setTimeout(()=>tone(f,2.5,.15),i*180));
const sparkle=()=>[1500,2000,2600].forEach((f,i)=>setTimeout(()=>tone(f,.4,.05,'triangle'),i*90));
$('#bMusic').onclick=()=>{audio();musicOn=!musicOn;$('#bMusic').textContent=musicOn?'🎵 ON':'🔇 OFF';master.gain.value=musicOn?+$('#vol').value:0};
$('#vol').oninput=e=>{if(master&&musicOn)master.gain.value=+e.target.value};
addEventListener('pointerdown',audio,{once:true});
// ---------- Krathong shop modal ----------
const kPrev=()=>({type:+$('#kt').value,color:$('#kc').value,flower:+$('#kf').value,candle:+$('#kcd').value,incense:$('#ki').value==='1',deco:+$('#kd').value});
function upK(){const c=$('#kprev').getContext('2d');c.clearRect(0,0,48,48);drawKr(c,kPrev(),1)}
['kt','kc','kf','kcd','ki','kd'].forEach(i=>$('#'+i).oninput=upK);
function openShop(){$('#modal').style.display='flex';upK()}
$('#kx').onclick=()=>$('#modal').style.display='none';
$('#kok').onclick=()=>{krMine=kPrev();socket.emit('krathong',krMine);tone(660,.3,.1);$('#modal').style.display='none';toast('ได้รับกระทงแล้ว! เดินไปท่าเรือด้วยกันนะ')};
// ---------- Phaser game ----------
const SOLID=[[40,40,300,180],[480,60,200,130],[760,60,200,130],[1080,40,280,170],[1180,110,0,0],[470,430,120,60],[980,440,100,60],[1250,520,140,40],[60,520,120,120],[300,700,100,100],[1450,300,100,150],[1380,900,150,200],[20,900,200,260]]; // building/stalls/trees
const ZONES=[{n:'🌙 Spawn Area',x:250,y:260,r:160},{n:'🏮 Festival Market',x:700,y:250,r:260},{n:'🛖 Krathong Shop',x:1220,y:280,r:150},{n:'📸 Photo Spot',x:1300,y:700,r:150},{n:'🌊 Riverside',x:750,y:960,r:250}];
const SHOP={x:1220,y:270},PHOTO={x:1300,y:700};
function startGame(){

  setupJoy(){const j=$('#joy'),k=$('#knob');const mv=e=>{const r=j.getBoundingClientRect(),t=e.touches?e.touches[0]:e;let dx=t.clientX-r.left-60,dy=t.clientY-r.top-60;const d=Math.hypot(dx,dy)||1,c=Math.min(d,50);dx=dx/d*c;dy=dy/d*c;k.style.left=40+dx+'px';k.style.top=40+dy+'px';this.joy={x:dx/50,y:dy/50}};

  update(t,dt){

    this.npcs.forEach(n=>{n.x=n.ox+Math.sin(t/1500+n.ph)*60;n.y=n.oy+Math.cos(t/2000+n.ph*2)*14;n.setTexture(this.ct({gender:'male',hairColor:'#222',hairStyle:'short',shirt:'#4a7a3a'},'down',0));n.setDepth(n.y)});

  mini(){const c=$('#mini').getContext('2d'),sx=140/W,sy=105/H;c.fillStyle='#16294a';c.fillRect(0,0,140,105);c.fillStyle='#6b5a86';c.fillRect(0,200*sy,140,110*sy);c.fillRect(560*sx,200*sy,300*sx,700*sy);c.fillStyle='#0a4a6a';c.fillRect(0,900*sy,140,105);
    c.fillStyle='#ffd86b';ZONES.forEach(z=>c.fillRect(z.x*sx-2,z.y*sy-2,4,4));
    Object.values(this.pl).forEach(e=>{c.fillStyle=e.id===me?'#ff4f7a':'#7ad0ff';c.beginPath();c.arc(e.x*sx,e.y*sy,3,0,7);c.fill()})}
}
// photo modal buttons
$('#pRe').onclick=()=>$('#photo').style.display='none';
$('#pSave').onclick=()=>{const a=document.createElement('a');a.href=scene.photoURL;a.download='loy-krathong-together.png';a.click()};
$('#pShare').onclick=async()=>{try{const b=await (await fetch(scene.photoURL)).blob();const f=new File([b],'loy-krathong.png',{type:'image/png'});
  if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:'Together Loy Krathong'});else{toast('อุปกรณ์นี้ไม่รองรับการแชร์ — กด Save Image แทน')}}catch(e){}};
</script></body></html>
