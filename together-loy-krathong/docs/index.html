<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ลอยกระทงด้วยกัน (Real-time Multiplayer)</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; user-select: none; }
    body {
      background: #0b1622;
      color: #fff;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #08111a;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
    }

    /* Top HUD (Roblox Style) */
    .top-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .hud-pill {
      pointer-events: auto;
      background: rgba(18, 24, 34, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .btn {
      background: linear-gradient(135deg, #ff9f43, #ee5253);
      border: none;
      color: #fff;
      padding: 7px 14px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s, filter 0.12s;
      font-size: 13px;
    }
    .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn:active { transform: scale(0.97); }
    .btn-secondary { background: rgba(255,255,255,0.14); }
    .btn-teal { background: linear-gradient(135deg, #1dd1a1, #10ac84); }

    /* Bottom Controls & Chat */
    .bottom-bar {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 10;
    }
    .chat-box {
      pointer-events: auto;
      background: rgba(18, 24, 34, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 8px;
      width: 320px;
      max-width: 60vw;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chat-log {
      max-height: 95px;
      overflow-y: auto;
      font-size: 12px;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 0 4px;
    }
    .chat-input-row {
      display: flex;
      gap: 6px;
    }
    .chat-input-row input {
      flex: 1;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 6px 10px;
      color: #fff;
      font-size: 13px;
      outline: none;
      user-select: text;
    }
    .action-panel {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .emote-row {
      display: flex;
      gap: 6px;
      background: rgba(18, 24, 34, 0.8);
      padding: 6px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .emote-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .emote-btn:hover { transform: scale(1.25); }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 12, 20, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
    }
    .modal {
      background: #162231;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 20px;
      padding: 24px;
      width: 400px;
      max-width: 92vw;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .modal h2 { font-size: 20px; margin-bottom: 6px; color: #ffd166; }
    .modal p { font-size: 13px; color: #cbd5e1; margin-bottom: 16px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .field input, .field select {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #0e1722;
      color: #fff;
      font-size: 14px;
      user-select: text;
    }
    .color-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .swatch {
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent;
    }
    .swatch.active { border-color: #fff; transform: scale(1.12); }

    /* Wish Tooltip */
    #wish-toast {
      position: absolute;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 25, 38, 0.92);
      border: 1px solid #ffd166;
      color: #fff;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 13px;
      display: none;
      z-index: 20;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="world" width="960" height="540"></canvas>

  <div class="top-bar">
    <div class="hud-pill">
      <span>🏮 ห้อง: <strong id="hud-room">-</strong></span>
      <span>👥 ออนไลน์: <strong id="hud-count">1</strong></span>
      <button class="btn btn-secondary" id="copy-invite-btn">🔗 คัดลอกลิงก์ชวนแฟน</button>
    </div>
    <div class="hud-pill">
      <button class="btn btn-teal" id="open-krathong-btn">🪷 ทำกระทง & ลอยกระทง</button>
    </div>
  </div>

  <div id="wish-toast"></div>

  <div class="bottom-bar">
    <div class="chat-box">
      <div class="chat-log" id="chat-log">
        <div style="color:#ffd166">✨ คลิกที่พื้นหรือใช้ปุ่ม WASD / ลูกศร เพื่อเดินริมตลิ่ง</div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="พิมพ์คุยกับแฟน (ข้อความขึ้นบนหัว)..." maxlength="80" />
        <button class="btn" id="send-chat-btn">ส่ง</button>
      </div>
    </div>

    <div class="action-panel">
      <div class="emote-row">
        <button class="emote-btn" data-emote="❤️">❤️</button>
        <button class="emote-btn" data-emote="🥰">🥰</button>
        <button class="emote-btn" data-emote="🙏">🙏</button>
        <button class="emote-btn" data-emote="✨">✨</button>
        <button class="emote-btn" data-emote="🏮">🏮</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal เข้าห้อง & แต่งตัวละคร -->
<div class="modal-backdrop" id="join-modal">
  <div class="modal">
    <h2>🏮 ลอยกระทงด้วยกัน (Real-time)</h2>
    <p>สร้างตัวละครและตั้งรหัสห้องเดียวกันเพื่อเข้ามาเจอกันริมแม่น้ำ</p>

    <div class="field">
      <label>ชื่อตัวละครของคุณ (แสดงบนหัวแบบ Roblox)</label>
      <input type="text" id="input-name" placeholder="เช่น น้องบีม, พี่ภัทร..." maxlength="16" />
    </div>

    <div class="field">
      <label>รหัสห้อง (ใช้รหัสเดียวกันกับแฟน)</label>
      <input type="text" id="input-room" placeholder="เช่น LOVE2026" maxlength="12" />
    </div>

    <div class="field">
      <label>ทรงผม</label>
      <select id="input-hair-style">
        <option value="0">ผมสั้นน่ารัก</option>
        <option value="1">ผมยาวประบ่า</option>
        <option value="2">ผมมัดจุก / หางม้า</option>
      </select>
    </div>

    <div class="field">
      <label>สีผม</label>
      <div class="color-row" id="hair-colors"></div>
    </div>

    <div class="field">
      <label>สีชุด</label>
      <div class="color-row" id="outfit-colors"></div>
    </div>

    <button class="btn btn-teal" style="width:100%; padding:11px; font-size:15px; margin-top:6px;" id="join-btn">
      เข้าสู่ริมแม่น้ำ ✨
    </button>
  </div>
</div>

<!-- Modal ทำกระทง -->
<div class="modal-backdrop" id="krathong-modal" style="display:none;">
  <div class="modal">
    <h2>🪷 ประดิษฐ์กระทงของคุณ</h2>
    <p>ตัวละครจะเดินไปริมตลิ่งแล้วปล่อยกระทงลงน้ำให้เห็นพร้อมกันทั้ง 2 จอ</p>

    <div class="field">
      <label>รูปแบบกระทง</label>
      <select id="krathong-style">
        <option value="lotus">กระทงใบตอง-ดอกบัวเรืองแสง</option>
        <option value="raft">กระทงแพไม้ไผ่</option>
        <option value="leaf">กระทงใบบัวธรรมชาติ</option>
      </select>
    </div>

    <div class="field">
      <label>สีแสงเทียน</label>
      <select id="krathong-candle">
        <option value="#ffdd55">เหลืองทองอบอุ่น</option>
        <option value="#ff7eb3">ชมพูโรแมนติก</option>
        <option value="#7bed9f">เขียวมรกต</option>
      </select>
    </div>

    <div class="field">
      <label>คำอธิษฐาน (คลิกที่กระทงในน้ำเพื่ออ่านได้)</label>
      <input type="text" id="krathong-wish" placeholder="ขอให้เราอยู่ด้วยกันไปนานๆ..." maxlength="100" />
    </div>

    <div style="display:flex; gap:8px; margin-top:14px;">
      <button class="btn btn-secondary" style="flex:1;" id="close-krathong-btn">ยกเลิก</button>
      <button class="btn btn-teal" style="flex:2;" id="confirm-krathong-btn">🙏 อธิษฐานและลอยกระทง</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('world');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const urlParams = new URLSearchParams(window.location.search);
  const defaultRoom = (urlParams.get('room') || 'LOVE' + Math.floor(100 + Math.random() * 900)).toUpperCase();
  document.getElementById('input-room').value = defaultRoom;

  // ตัวเลือกแต่งตัวละคร
  const hairPalette = ['#2c1e16', '#5c3824', '#d4a359', '#e55039', '#6c5ce7', '#dfe6e9'];
  const outfitPalette = ['#8d5524', '#c0392b', '#2980b9', '#16a085', '#8e44ad', '#e67e22'];
  let selectedHair = hairPalette[0];
  let selectedOutfit = outfitPalette[0];

  function renderSwatches(containerId, colors, onSelect) {
    const el = document.getElementById(containerId);
    colors.forEach((c, idx) => {
      const div = document.createElement('div');
      div.className = 'swatch' + (idx === 0 ? ' active' : '');
      div.style.background = c;
      div.onclick = () => {
        el.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        div.classList.add('active');
        onSelect(c);
      };
      el.appendChild(div);
    });
  }
  renderSwatches('hair-colors', hairPalette, c => selectedHair = c);
  renderSwatches('outfit-colors', outfitPalette, c => selectedOutfit = c);

  // เชื่อมต่อ Socket.IO
  const serverUrl = (window.GAME_CONFIG && window.GAME_CONFIG.SERVER_URL) || undefined;
  const socket = io(serverUrl);

  let selfId = null;
  let currentRoom = defaultRoom;
  const players = new Map();
  let krathongs = [];
  const floatingEmotes = [];
  const chatBubbles = new Map();

  // สถานะการเดินของตัวเรา
  const keys = {};
  let targetPos = null;
  let lastSync = 0;

  window.addEventListener('keydown', e => {
    if (document.activeElement.tagName === 'INPUT') return;
    keys[e.key.toLowerCase()] = true;
    targetPos = null;
  });
  window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
  });

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clickX = (e.clientX - rect.left) * scaleX;
    const clickY = (e.clientY - rect.top) * scaleY;

    // เช็คว่าคลิกโดนกระทงในน้ำเพื่ออ่านคำอธิษฐานหรือไม่
    for (let i = krathongs.length - 1; i >= 0; i--) {
      const k = krathongs[i];
      if (Math.hypot(clickX - k.x, clickY - k.y) < 24) {
        showWishToast(`🪷 กระทงของ <strong>${escapeHtml(k.ownerName)}</strong>: "${escapeHtml(k.wish)}"`);
        return;
      }
    }

    // ถ้าคลิกบนฝั่ง ให้เดินไปจุดนั้น
    if (clickY >= 150 && clickY <= 318) {
      targetPos = { x: Math.max(50, Math.min(910, clickX)), y: clickY };
    } else if (clickY > 318) {
      // คลิกในน้ำ -> เดินมาริมตลิ่งตรงจุดนั้น
      targetPos = { x: Math.max(50, Math.min(910, clickX)), y: 312 };
    }
  });

  function showWishToast(html) {
    const toast = document.getElementById('wish-toast');
    toast.innerHTML = html;
    toast.style.display = 'block';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.style.display = 'none', 5000);
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }

  function addChatLog(name, text) {
    const log = document.getElementById('chat-log');
    const row = document.createElement('div');
    row.innerHTML = `<strong style="color:#7bed9f">${escapeHtml(name)}:</strong> ${escapeHtml(text)}`;
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  }

  // ปุ่มเข้าห้อง
  document.getElementById('join-btn').onclick = () => {
    const name = document.getElementById('input-name').value.trim() || 'คู่รักนักเดินทาง';
    const roomId = document.getElementById('input-room').value.trim().toUpperCase() || defaultRoom;
    const hairStyle = Number(document.getElementById('input-hair-style').value);

    socket.emit('join_room', {
      roomId,
      name,
      avatar: {
        skin: '#f1c27d',
        hairColor: selectedHair,
        hairStyle,
        outfitColor: selectedOutfit
      }
    });

    document.getElementById('join-modal').style.display = 'none';
  };

  // คัดลอกลิงก์ชวนแฟน
  document.getElementById('copy-invite-btn').onclick = () => {
    const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoom}`;
    navigator.clipboard.writeText(inviteUrl);
    showWishToast(`📋 คัดลอกลิงก์ห้อง <strong>${currentRoom}</strong> แล้ว! ส่งให้แฟนกดเข้ามาเจอกันได้เลย`);
  };

  // ระบบแชท
  function sendChat() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    socket.emit('player_chat', text);
    input.value = '';
  }
  document.getElementById('send-chat-btn').onclick = sendChat;
  document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendChat();
  });

  // อีโมจิ
  document.querySelectorAll('.emote-btn').forEach(btn => {
    btn.onclick = () => socket.emit('player_emote', btn.dataset.emote);
  });

  // ระบบทำกระทง
  document.getElementById('open-krathong-btn').onclick = () => {
    document.getElementById('krathong-modal').style.display = 'flex';
  };
  document.getElementById('close-krathong-btn').onclick = () => {
    document.getElementById('krathong-modal').style.display = 'none';
  };
  document.getElementById('confirm-krathong-btn').onclick = () => {
    const style = document.getElementById('krathong-style').value;
    const candleColor = document.getElementById('krathong-candle').value;
    const wish = document.getElementById('krathong-wish').value.trim() || 'ขอให้มีความสุขและรักกันตลอดไป';

    document.getElementById('krathong-modal').style.display = 'none';

    const me = players.get(selfId);
    if (me) {
      // เดินลงมาชิดริมน้ำแล้วย่อตัวปล่อยกระทง
      me.y = 310;
      me.dir = 'down';
      me.kneeling = true;
      socket.emit('player_move', me);
      socket.emit('launch_krathong', { style, candleColor, wish });

      setTimeout(() => {
        if (players.get(selfId)) {
          players.get(selfId).kneeling = false;
          socket.emit('player_move', players.get(selfId));
        }
      }, 1500);
    }
  };

  // Socket Listeners
  socket.on('init_state', (data) => {
    selfId = data.selfId;
    currentRoom = data.roomId;
    document.getElementById('hud-room').textContent = currentRoom;

    players.clear();
    data.players.forEach(p => {
      p.renderX = p.x;
      p.renderY = p.y;
      players.set(p.id, p);
    });
    krathongs = data.krathongs || [];
    updatePlayerCount();
  });

  socket.on('player_joined', (p) => {
    p.renderX = p.x;
    p.renderY = p.y;
    players.set(p.id, p);
    updatePlayerCount();
    addChatLog('ระบบ', `${p.name} เดินทางมาถึงริมแม่น้ำแล้ว 💕`);
  });

  socket.on('player_moved', (data) => {
    const p = players.get(data.id);
    if (!p) return;
    p.x = data.x;
    p.y = data.y;
    p.dir = data.dir;
    p.moving = data.moving;
    p.kneeling = data.kneeling;
  });

  socket.on('player_chatted', (data) => {
    const p = players.get(data.id);
    const name = p ? p.name : 'ผู้เล่น';
    addChatLog(name, data.text);
    chatBubbles.set(data.id, { text: data.text, expires: Date.now() + 5000 });
  });

  socket.on('player_emoted', (data) => {
    const p = players.get(data.id);
    if (!p) return;
    floatingEmotes.push({
      x: p.renderX,
      y: p.renderY - 42,
      emoji: data.emoji,
      alpha: 1
    });
  });

  socket.on('krathong_launched', (k) => {
    krathongs.push(k);
    addChatLog('🪷', `${k.ownerName} ลอยกระทงแล้ว: "${k.wish}"`);
  });

  socket.on('player_left', (id) => {
    const p = players.get(id);
    if (p) addChatLog('ระบบ', `${p.name} ออกจากห้องแล้ว`);
    players.delete(id);
    updatePlayerCount();
  });

  function updatePlayerCount() {
    document.getElementById('hud-count').textContent = players.size;
  }

  // ==================== PIXEL ART SCENE RENDERER ====================
  function drawBackground(time) {
    // 1. สนามหญ้าริมฝั่ง (ด้านบน)
    ctx.fillStyle = '#274e2b';
    ctx.fillRect(0, 0, 960, 290);

    // ลวดลายหญ้าและพุ่มไม้เล็กๆ
    ctx.fillStyle = '#1e3f22';
    for (let x = 20; x < 940; x += 65) {
      for (let y = 30; y < 250; y += 55) {
        ctx.fillRect(x, y, 8, 4);
        ctx.fillRect(x + 4, y - 4, 4, 4);
      }
    }

    // 2. หน้าผาหิน & น้ำตกมุมซ้ายบน (สไตล์ในรูป)
    ctx.fillStyle = '#2c353d';
    ctx.fillRect(0, 0, 250, 240);
    ctx.fillStyle = '#3d4852';
    ctx.fillRect(140, 40, 120, 210);
    ctx.fillStyle = '#53616e';
    ctx.fillRect(155, 55, 90, 170);

    // สายน้ำตกไหลลงแม่น้ำ
    ctx.fillStyle = '#2a6f97';
    ctx.fillRect(0, 0, 125, 310);
    ctx.fillStyle = '#4ea8de';
    const wfOffset = Math.floor(time / 60) % 24;
    for (let y = wfOffset - 24; y < 305; y += 24) {
      ctx.fillRect(18, y, 16, 14);
      ctx.fillRect(54, y + 8, 22, 14);
      ctx.fillRect(92, y + 2, 14, 14);
    }
    // ฟองคลื่นตรงฐานน้ำตก
    ctx.fillStyle = '#caf0f8';
    ctx.fillRect(8, 296 + Math.sin(time / 150) * 2, 112, 8);

    // 3. ลานพิธีบูชาและแท่นหินกลางฝั่ง (เหมือนในรูป)
    ctx.fillStyle = '#5c3a21';
    ctx.beginPath();
    ctx.ellipse(540, 130, 135, 68, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#7f5539';
    ctx.lineWidth = 4;
    ctx.stroke();

    // แท่นหินศักดิ์สิทธิ์ + ดอกไม้ + เทียน
    ctx.fillStyle = '#8d7b68';
    ctx.fillRect(515, 55, 50, 65);
    ctx.fillStyle = '#a4907c';
    ctx.fillRect(522, 42, 36, 20);
    // กระถางดอกไม้ซ้าย-ขวา
    ctx.fillStyle = '#b5651d';
    ctx.fillRect(480, 92, 24, 22);
    ctx.fillRect(576, 92, 24, 22);
    ctx.fillStyle = '#ffbe0b';
    ctx.fillRect(482, 82, 20, 10);
    ctx.fillStyle = '#ff006e';
    ctx.fillRect(578, 82, 20, 10);

    // 4. ตลิ่งปูหินกรวดริมน้ำ
    ctx.fillStyle = '#9c9283';
    ctx.fillRect(110, 265, 850, 48);
    ctx.fillStyle = '#b7ad9e';
    for (let x = 118; x < 950; x += 26) {
      for (let y = 270; y < 306; y += 16) {
        ctx.fillRect(x + (y % 32 === 0 ? 8 : 0), y, 18, 10);
      }
    }
    // ขอบหาดทราย/น้ำตื้น
    ctx.fillStyle = '#e6ccb2';
    ctx.fillRect(110, 310, 850, 8);

    // 5. แม่น้ำยามค่ำคืน
    const waterGrad = ctx.createLinearGradient(0, 318, 0, 540);
    waterGrad.addColorStop(0, '#1d7874');
    waterGrad.addColorStop(0.35, '#114b5f');
    waterGrad.addColorStop(1, '#072227');
    ctx.fillStyle = waterGrad;
    ctx.fillRect(0, 318, 960, 222);

    // ระลอกคลื่นน้ำตื้น
    ctx.fillStyle = 'rgba(168, 237, 234, 0.25)';
    const waveShift = Math.sin(time / 400) * 6;
    for (let x = 120; x < 940; x += 34) {
      ctx.fillRect(x + waveShift, 326, 20, 5);
      ctx.fillRect(x - waveShift + 10, 342, 16, 4);
    }

    // 6. คบเพลิงจุดไฟริมตลิ่ง (ให้แสงอบอุ่น)
    const torchPositions = [275, 575, 815];
    torchPositions.forEach((tx, idx) => {
      ctx.fillStyle = '#4a2c11';
      ctx.fillRect(tx - 3, 215, 6, 48);
      const flicker = Math.sin(time / 90 + idx) * 2;
      // แสงไฟเรืองรอง
      const glow = ctx.createRadialGradient(tx, 210, 2, tx, 210, 36);
      glow.addColorStop(0, 'rgba(255, 190, 11, 0.75)');
      glow.addColorStop(1, 'rgba(255, 190, 11, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(tx, 210, 36, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ff9f1c';
      ctx.fillRect(tx - 4, 204 + flicker, 8, 10);
      ctx.fillStyle = '#fff3b0';
      ctx.fillRect(tx - 2, 207 + flicker, 4, 6);
    });
  }

  function drawKrathong(k, time) {
    const bob = Math.sin((time + k.seed) / 350) * 2;
    const x = k.x;
    const y = k.y + bob;

    // แสงสะท้อนสีเขียวมรกต-ทองบนผิวน้ำรอบกระทง (แบบในรูป)
    const aura = ctx.createRadialGradient(x, y, 2, x, y, 26);
    aura.addColorStop(0, 'rgba(100, 255, 218, 0.55)');
    aura.addColorStop(0.5, 'rgba(255, 221, 85, 0.25)');
    aura.addColorStop(1, 'rgba(100, 255, 218, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(x, y, 26, 0, Math.PI * 2);
    ctx.fill();

    // ฐานกระทงตามสไตล์ที่เลือก
    if (k.style === 'raft') {
      ctx.fillStyle = '#8d5524';
      ctx.fillRect(x - 12, y - 3, 24, 8);
      ctx.fillStyle = '#c68642';
      ctx.fillRect(x - 10, y - 5, 20, 4);
    } else if (k.style === 'leaf') {
      ctx.fillStyle = '#2ecc71';
      ctx.beginPath();
      ctx.ellipse(x, y, 13, 6, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // กระทงดอกบัว
      ctx.fillStyle = '#27ae60';
      ctx.fillRect(x - 11, y - 2, 22, 6);
      ctx.fillStyle = '#ff7979';
      ctx.fillRect(x - 8, y - 6, 16, 5);
    }

    // เทียนและเปลวไฟ
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 1.5, y - 11, 3, 6);
    const flame = Math.sin(time / 80 + k.seed) * 1.5;
    ctx.fillStyle = k.candleColor || '#ffdd55';
    ctx.fillRect(x - 2.5, y - 16 + flame, 5, 5);
  }

  function drawPlayer(p, time) {
    const x = Math.round(p.renderX);
    const y = Math.round(p.renderY);
    const walkBob = p.moving ? Math.abs(Math.sin(time / 110)) * 3 : 0;
    const squat = p.kneeling ? 6 : 0;

    // เงาใต้เท้า
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.beginPath();
    ctx.ellipse(x, y + 2, 11, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    const bodyY = y - walkBob + squat;

    // ขา
    ctx.fillStyle = p.avatar.skin;
    ctx.fillRect(x - 6, bodyY - 8, 4, 8 - squat / 2);
    ctx.fillRect(x + 2, bodyY - 8, 4, 8 - squat / 2);

    // ลำตัว / ชุด
    ctx.fillStyle = p.avatar.outfitColor;
    ctx.fillRect(x - 8, bodyY - 22, 16, 15);

    // หัว
    ctx.fillStyle = p.avatar.skin;
    ctx.fillRect(x - 8, bodyY - 36, 16, 14);

    // ดวงตา (หันตามทิศทาง)
    ctx.fillStyle = '#1e272e';
    if (p.dir !== 'up') {
      const eyeOffset = p.dir === 'left' ? -2 : p.dir === 'right' ? 2 : 0;
      ctx.fillRect(x - 4 + eyeOffset, bodyY - 29, 2, 3);
      ctx.fillRect(x + 2 + eyeOffset, bodyY - 29, 2, 3);
    }

    // ทรงผม
    ctx.fillStyle = p.avatar.hairColor;
    ctx.fillRect(x - 9, bodyY - 39, 18, 6);
    if (p.avatar.hairStyle === 1) {
      // ผมยาว
      ctx.fillRect(x - 10, bodyY - 35, 3, 14);
      ctx.fillRect(x + 7, bodyY - 35, 3, 14);
    } else if (p.avatar.hairStyle === 2) {
      // มัดจุกบนหัว
      ctx.fillRect(x - 3, bodyY - 44, 6, 5);
    }

    // ป้ายชื่อเหนือหัวแบบ Roblox
    ctx.font = 'bold 11px Prompt, sans-serif';
    ctx.textAlign = 'center';
    const nameWidth = ctx.measureText(p.name).width + 10;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
    ctx.fillRect(x - nameWidth / 2, bodyY - 56, nameWidth, 15);
    ctx.fillStyle = p.id === selfId ? '#ffd166' : '#ffffff';
    ctx.fillText(p.name, x, bodyY - 45);

    // กล่องข้อความแชทลอยบนหัวแบบ Roblox
    const bubble = chatBubbles.get(p.id);
    if (bubble && bubble.expires > Date.now()) {
      ctx.font = '12px Prompt, sans-serif';
      const bw = Math.min(200, ctx.measureText(bubble.text).width + 16);
      const bx = x - bw / 2;
      const by = bodyY - 82;

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, 22, 8);
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.fillText(bubble.text, x, by + 15, 190);
    }
  }

  // Main Game Loop
  let lastFrame = performance.now();
  function loop(now) {
    const dt = (now - lastFrame) / 1000;
    lastFrame = now;

    // อัปเดตการเดินของตัวเรา
    const me = players.get(selfId);
    if (me && !me.kneeling) {
      let dx = 0, dy = 0;
      if (keys['w'] || keys['arrowup']) dy -= 1;
      if (keys['s'] || keys['arrowdown']) dy += 1;
      if (keys['a'] || keys['arrowleft']) dx -= 1;
      if (keys['d'] || keys['arrowright']) dx += 1;

      if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        dx /= len; dy /= len;
        me.x = Math.max(45, Math.min(915, me.x + dx * 135 * dt));
        me.y = Math.max(155, Math.min(314, me.y + dy * 135 * dt));
        me.moving = true;
        me.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      } else if (targetPos) {
        const dist = Math.hypot(targetPos.x - me.x, targetPos.y - me.y);
        if (dist > 4) {
          const vx = (targetPos.x - me.x) / dist;
          const vy = (targetPos.y - me.y) / dist;
          me.x += vx * 135 * dt;
          me.y += vy * 135 * dt;
          me.moving = true;
          me.dir = Math.abs(vx) > Math.abs(vy) ? (vx > 0 ? 'right' : 'left') : (vy > 0 ? 'down' : 'up');
        } else {
          targetPos = null;
          me.moving = false;
        }
      } else {
        me.moving = false;
      }

      // ส่งตำแหน่งให้แฟนแบบ Real-time (20 ครั้ง/วินาที)
      if (now - lastSync > 50) {
        lastSync = now;
        socket.emit('player_move', {
          x: me.x,
          y: me.y,
          dir: me.dir,
          moving: me.moving,
          kneeling: me.kneeling
        });
      }
    }

    // Smooth Interpolation สำหรับผู้เล่นทุกคน
    players.forEach(p => {
      p.renderX += (p.x - p.renderX) * 0.25;
      p.renderY += (p.y - p.renderY) * 0.25;
    });

    // อัปเดตกระทงฝั่ง Client ให้ลอยลื่นๆ
    krathongs.forEach(k => {
      k.x += k.vx * 0.6;
      k.y += k.vy * 0.35;
    });

    // วาดฉากทั้งหมด
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground(now);

    // วาดกระทงในน้ำ
    krathongs.forEach(k => drawKrathong(k, now));

    // วาดตัวละครเรียงตามแกน Y (Y-sorting) เพื่อความสมจริง
    const sortedPlayers = Array.from(players.values()).sort((a, b) => a.renderY - b.renderY);
    sortedPlayers.forEach(p => drawPlayer(p, now));

    // วาดอีโมจิลอยขึ้นฟ้า
    for (let i = floatingEmotes.length - 1; i >= 0; i--) {
      const em = floatingEmotes[i];
      em.y -= 35 * dt;
      em.alpha -= 0.75 * dt;
      if (em.alpha <= 0) {
        floatingEmotes.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = em.alpha;
      ctx.font = '22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(em.emoji, em.x, em.y);
      ctx.restore();
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
